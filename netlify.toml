# Netlify: publish the static site in site/ as-is (no build step).
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# No long-lived Cache-Control: Netlify's default (revalidate with ETag) keeps
# browsers from mixing an old landing.js with a new index.html. Pages also link
# assets with ?v=<hash> (tools/stamp-assets.py).
[[headers]]
  for = "/embeds/*"
  [headers.values]
    X-Robots-Tag = "noindex"
