# Netlify: publish the static site in site/ as-is (no build step).
[build]
  publish = "site"
  command = ""

# Serverless functions: netlify/functions/lead.mjs sends each partner request to the Telegram chat
# (its token and chat in the site's environment variables, see the function).
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Static files are cached for a year. Safe because pages link them as
# file?v=<content hash> (tools/stamp-assets.py), vendor folders carry the
# library version, and HTML pages themselves are always revalidated.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/embeds/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Robots-Tag = "noindex"

# The Commission Plans concept page became the translated commission plan page.
[[redirects]]
  from = "/commission-plans/*"
  to = "/partner-terms/"
  status = 301

# The tools showcase is Marketing Tools again, at /marketing-tools/. /partner-tools/ (its address for a while) is kept
# for the coming page for newcomers to trading; until then it sends visitors to /marketing-tools/ — temporarily (302),
# so that browsers do not remember it. Delete these four rules when the new page is published.
[[redirects]]
  from = "/partner-tools"
  to = "/marketing-tools/"
  status = 302

[[redirects]]
  from = "/partner-tools/*"
  to = "/marketing-tools/:splat"
  status = 302

[[redirects]]
  from = "/:lang/partner-tools"
  to = "/:lang/marketing-tools/"
  status = 302

[[redirects]]
  from = "/:lang/partner-tools/*"
  to = "/:lang/marketing-tools/:splat"
  status = 302

# The commission plan page moved from /commission-plan/ to /partner-terms/ (every language).
[[redirects]]
  from = "/commission-plan"
  to = "/partner-terms/"
  status = 301

[[redirects]]
  from = "/commission-plan/*"
  to = "/partner-terms/:splat"
  status = 301

[[redirects]]
  from = "/:lang/commission-plan"
  to = "/:lang/partner-terms/"
  status = 301

[[redirects]]
  from = "/:lang/commission-plan/*"
  to = "/:lang/partner-terms/:splat"
  status = 301
