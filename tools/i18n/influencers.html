<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{inf.meta.title}}</title>
<meta name="description" content="{{@inf.meta.description}}">
<!-- in development: private (netlify/edge-functions/preview.js) and not indexed; drop this line at launch -->
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="{{canonical}}">
{{hreflang}}
<meta name="theme-color" content="#ffffff">
{{> head}}
</head>
<body>
<div class="tp">

  {{> page-header-start}}
  {{> page-header-end}}

  <main>
    <!-- Hero (owner's design, November 2026): the heading, the pitch, the CTA and two ticks on the left; on the right the
         design's scene: an Instagram post and a Telegram post of "your channel" in glass, wired to a dark "Your
         commissions" panel. Phones: the text, then the scene full width. -->
    <section id="hero" class="inf-hero" data-screen-label="Influencers hero">
      <div class="inf-hero__in">
        <div class="inf-hero__copy">
          <h1 class="inf-hero__h1 tq-h1" data-fitw>{{inf.hero.h1}}</h1>
          <p class="inf-hero__sub">{{inf.hero.sub}}</p>
          <a class="inf-cta" href="{{signupHref}}"{{signupNav}}><span class="inf-cta__t">{{nav.cta}}</span><span class="inf-cta__dot"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></a>
          <ul class="inf-hero__ticks">
            <li>{{inf.hero.ck1}}</li>
            <li>{{inf.hero.ck2}}</li>
          </ul>
        </div>

        <div class="inf-hero__vis">
          <!-- the scene is the design's own picture (tools/influencers/make.py: the glass, glints, wires and tilt as drawn;
               two lines of its copy re-set); 507px wide at 1x, as in the design, sharp on 2x screens -->
          <img class="inf-hero__img" src="{{root}}assets/influencers/scene-1014.webp"
               srcset="{{root}}assets/influencers/scene-507.webp 507w, {{root}}assets/influencers/scene-760.webp 760w, {{root}}assets/influencers/scene-1014.webp 1014w"
               sizes="(max-width: 900px) min(100vw - 32px, 540px), min(46vw, 560px)" width="1014" height="1040" alt="{{@inf.hero.alt}}" fetchpriority="high">
        </div>
      </div>
    </section>

    <!-- Creators on platforms (owner's design "Creator Platforms Scene", November 2026): five creators orbiting the
         TradeQuo planet, on Instagram, Telegram or TikTok: three pictures (tools/influencers/creators.py), one per
         platform, each with its own palette. A tab plays the design's change: a flash and shock rings from the planet,
         the new picture opening out from it in a ring of its colour, the orbit drawn again, the title wiped in
         (assets/js/orbit.js). The block has the hero's width (its column, centred); the picture is sharp to its edges
         and melts into the page on all four sides with a short eased fade (influencers.css .inf-orbit). -->
    <section id="platforms" class="inf-orbit" data-orbit data-pal="0" data-screen-label="Creators on platforms">
    <div class="inf-orbit__in">
    <div class="inf-orbit__frame">
    <div class="inf-orbit__stage" data-orbit-root role="region" aria-label="{{@inf.orbit.aria}} Instagram" data-aria="{{@inf.orbit.aria}}">
      <div class="inf-orbit__group" data-group="0">
        <div class="inf-orbit__drift" data-l="drift">
          <img data-l="sky" src="{{root}}assets/influencers/orbit-instagram-1774.webp" srcset="{{root}}assets/influencers/orbit-instagram-1100.webp 1100w, {{root}}assets/influencers/orbit-instagram-1774.webp 1774w" sizes="100vw" alt="" loading="lazy" decoding="async" class="inf-orbit__sky">
          <img data-l="bg" src="{{root}}assets/influencers/orbit-instagram-1774.webp" srcset="{{root}}assets/influencers/orbit-instagram-1100.webp 1100w, {{root}}assets/influencers/orbit-instagram-1774.webp 1774w" sizes="100vw" alt="{{@inf.orbit.ig}}" loading="lazy" decoding="async" class="inf-orbit__bg">
          <img data-l="icon" src="{{root}}assets/influencers/orbit-instagram-1774.webp" srcset="{{root}}assets/influencers/orbit-instagram-1100.webp 1100w, {{root}}assets/influencers/orbit-instagram-1774.webp 1774w" sizes="100vw" alt="" loading="lazy" decoding="async" class="inf-orbit__icon">
          <img data-l="title" src="{{root}}assets/influencers/orbit-instagram-1774.webp" srcset="{{root}}assets/influencers/orbit-instagram-1100.webp 1100w, {{root}}assets/influencers/orbit-instagram-1774.webp 1774w" sizes="100vw" alt="" loading="lazy" decoding="async" class="inf-orbit__title">
          <img data-l="planet" src="{{root}}assets/influencers/orbit-instagram-1774.webp" srcset="{{root}}assets/influencers/orbit-instagram-1100.webp 1100w, {{root}}assets/influencers/orbit-instagram-1774.webp 1774w" sizes="100vw" alt="" loading="lazy" decoding="async" class="inf-orbit__planet">
        </div>
        <div class="inf-orbit__edge inf-orbit__edge--instagram" data-l="edge"></div>
      </div>
      <div class="inf-orbit__group" data-group="1" data-off>
        <div class="inf-orbit__drift" data-l="drift">
          <img data-l="sky" src="{{root}}assets/influencers/orbit-telegram-1774.webp" srcset="{{root}}assets/influencers/orbit-telegram-1100.webp 1100w, {{root}}assets/influencers/orbit-telegram-1774.webp 1774w" sizes="100vw" alt="" loading="lazy" decoding="async" class="inf-orbit__sky">
          <img data-l="bg" src="{{root}}assets/influencers/orbit-telegram-1774.webp" srcset="{{root}}assets/influencers/orbit-telegram-1100.webp 1100w, {{root}}assets/influencers/orbit-telegram-1774.webp 1774w" sizes="100vw" alt="{{@inf.orbit.tg}}" loading="lazy" decoding="async" class="inf-orbit__bg">
          <img data-l="icon" src="{{root}}assets/influencers/orbit-telegram-1774.webp" srcset="{{root}}assets/influencers/orbit-telegram-1100.webp 1100w, {{root}}assets/influencers/orbit-telegram-1774.webp 1774w" sizes="100vw" alt="" loading="lazy" decoding="async" class="inf-orbit__icon">
          <img data-l="title" src="{{root}}assets/influencers/orbit-telegram-1774.webp" srcset="{{root}}assets/influencers/orbit-telegram-1100.webp 1100w, {{root}}assets/influencers/orbit-telegram-1774.webp 1774w" sizes="100vw" alt="" loading="lazy" decoding="async" class="inf-orbit__title">
          <img data-l="planet" src="{{root}}assets/influencers/orbit-telegram-1774.webp" srcset="{{root}}assets/influencers/orbit-telegram-1100.webp 1100w, {{root}}assets/influencers/orbit-telegram-1774.webp 1774w" sizes="100vw" alt="" loading="lazy" decoding="async" class="inf-orbit__planet">
        </div>
        <div class="inf-orbit__edge inf-orbit__edge--telegram" data-l="edge"></div>
      </div>
      <div class="inf-orbit__group" data-group="2" data-off>
        <div class="inf-orbit__drift" data-l="drift">
          <img data-l="sky" src="{{root}}assets/influencers/orbit-tiktok-1774.webp" srcset="{{root}}assets/influencers/orbit-tiktok-1100.webp 1100w, {{root}}assets/influencers/orbit-tiktok-1774.webp 1774w" sizes="100vw" alt="" loading="lazy" decoding="async" class="inf-orbit__sky">
          <img data-l="bg" src="{{root}}assets/influencers/orbit-tiktok-1774.webp" srcset="{{root}}assets/influencers/orbit-tiktok-1100.webp 1100w, {{root}}assets/influencers/orbit-tiktok-1774.webp 1774w" sizes="100vw" alt="{{@inf.orbit.tt}}" loading="lazy" decoding="async" class="inf-orbit__bg">
          <img data-l="icon" src="{{root}}assets/influencers/orbit-tiktok-1774.webp" srcset="{{root}}assets/influencers/orbit-tiktok-1100.webp 1100w, {{root}}assets/influencers/orbit-tiktok-1774.webp 1774w" sizes="100vw" alt="" loading="lazy" decoding="async" class="inf-orbit__icon">
          <img data-l="title" src="{{root}}assets/influencers/orbit-tiktok-1774.webp" srcset="{{root}}assets/influencers/orbit-tiktok-1100.webp 1100w, {{root}}assets/influencers/orbit-tiktok-1774.webp 1774w" sizes="100vw" alt="" loading="lazy" decoding="async" class="inf-orbit__title">
          <img data-l="planet" src="{{root}}assets/influencers/orbit-tiktok-1774.webp" srcset="{{root}}assets/influencers/orbit-tiktok-1100.webp 1100w, {{root}}assets/influencers/orbit-tiktok-1774.webp 1774w" sizes="100vw" alt="" loading="lazy" decoding="async" class="inf-orbit__planet">
        </div>
        <div class="inf-orbit__edge inf-orbit__edge--tiktok" data-l="edge"></div>
      </div>

      <div class="inf-orbit__flash" data-fx="flash"></div>

      <svg class="inf-orbit__svg" viewBox="0 0 1774 887" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <filter id="tqGlow" x="-5%" y="-10%" width="110%" height="120%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <path id="tqOrbit" pathLength="1000" fill="none" d="M1532 684 C1523 687 1502 696 1480 702 C1458 708 1438 713 1400 720 C1362 727 1297 736 1250 742 C1203 748 1162 752 1120 757 C1078 762 1040 767 1000 771 C960 776 920 781 880 784 C840 788 800 791 760 792 C720 794 680 794 640 793 C600 792 560 790 520 788 C480 786 437 783 400 779 C363 775 330 771 300 764 C270 757 243 745 220 737 C197 729 178 723 160 714 C142 705 122 693 110 682 C98 671 91 660 88 650 C85 640 90 628 93 620 C96 612 101 607 107 600 C113 593 120 587 128 580 C137 573 143 569 158 560 C173 551 200 536 220 526 C240 516 260 510 280 502 C300 495 320 487 340 481 C360 475 370 472 400 464 C430 456 480 443 520 433 C560 423 600 413 640 405 C680 397 720 391 760 385 C800 379 840 372 880 367 C920 362 960 358 1000 353 C1040 348 1080 341 1120 338 C1160 335 1200 335 1240 335 C1280 335 1327 337 1360 339 C1393 341 1416 344 1440 347 C1465 351 1489 355 1507 360 C1525 366 1537 373 1548 380 C1559 387 1566 393 1571 400 C1576 407 1577 413 1577 420 C1577 427 1576 433 1573 440 C1570 447 1566 453 1560 460 C1554 467 1546 473 1537 480 C1528 487 1528 489 1508 500 C1489 512 1455 532 1420 549 C1385 566 1330 588 1300 600 C1270 612 1260 615 1240 622 C1220 629 1200 635 1180 641 C1160 647 1140 653 1120 658 C1100 663 1080 666 1060 671 C1040 676 1017 682 1000 686 C983 691 967 696 960 698"/>
          <mask id="tqHide" maskUnits="userSpaceOnUse" x="-100" y="-100" width="1974" height="1087"><rect x="-100" y="-100" width="1974" height="1087" fill="#fff"/><g fill="#000"><circle cx="297" cy="435" r="60"/><circle cx="1069" cy="375" r="62"/><circle cx="1353" cy="539" r="62"/><circle cx="327" cy="742" r="58"/><circle cx="1093" cy="742" r="58"/><rect x="360" y="404" width="278" height="59" rx="9"/><rect x="1136" y="348" width="251" height="58" rx="9"/><rect x="1419" y="510" width="287" height="58" rx="9"/><rect x="386" y="714" width="242" height="58" rx="9"/><rect x="1153" y="714" width="241" height="58" rx="9"/></g></mask>
        </defs>
        <g transform="translate(850 600) rotate(-8)">
          <ellipse data-fx="shock1" cx="0" cy="0" rx="800" ry="215" fill="none" stroke="#fff" stroke-width="3" vector-effect="non-scaling-stroke" filter="url(#tqGlow)" opacity="0"/>
          <ellipse data-fx="shock2" cx="0" cy="0" rx="800" ry="215" fill="none" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke" filter="url(#tqGlow)" opacity="0"/>
        </g>
        <g mask="url(#tqHide)">
          <use data-fx="draw" href="#tqOrbit" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="1000 1000" filter="url(#tqGlow)" opacity="0"/>
          <!-- the comet: its glow is wider, fainter strokes under it, not a filter (a blur filter on a shape that moves every
               frame can keep Chrome from painting the picture under the scene until something else repaints it) -->
          <g>
            <use data-amb="trail" href="#tqOrbit" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="120 880" opacity=".08"/>
            <use data-amb="trail" href="#tqOrbit" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="120 880" opacity=".16"/>
            <use data-amb="trail" href="#tqOrbit" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="120 880" opacity=".55"/>
            <use data-amb="head" href="#tqOrbit" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-dasharray="6 994" stroke-dashoffset="-114" opacity=".14"/>
            <use data-amb="head" href="#tqOrbit" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-dasharray="6 994" stroke-dashoffset="-114" opacity=".3"/>
            <use data-amb="head" href="#tqOrbit" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-dasharray="6 994" stroke-dashoffset="-114"/>
          </g>
          <g filter="url(#tqGlow)">
            <use data-fx="ftrail" href="#tqOrbit" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="220 780" opacity="0"/>
            <use data-fx="fhead" href="#tqOrbit" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="8 992" opacity="0"/>
          </g>
        </g>
      </svg>

      <div class="inf-orbit__streak" data-fx="streak"></div>
      <span class="inf-orbit__plate" style="left: 20.57%; top: 46.22%; width: 15.05%; height: 5.3%;"><span data-sheen></span></span>
      <span class="inf-orbit__plate" style="left: 64.32%; top: 39.91%; width: 13.53%; height: 5.19%;"><span data-sheen></span></span>
      <span class="inf-orbit__plate" style="left: 80.27%; top: 58.17%; width: 15.5%; height: 5.19%;"><span data-sheen></span></span>
      <span class="inf-orbit__plate" style="left: 22.04%; top: 81.17%; width: 13.02%; height: 5.19%;"><span data-sheen></span></span>
      <span class="inf-orbit__plate" style="left: 65.28%; top: 81.17%; width: 12.97%; height: 5.19%;"><span data-sheen></span></span>
    </div>
    <!-- the platform switch: over the scene's foot on wider screens, under it on phones (influencers.css) -->
    <div class="inf-orbit__tabs" role="tablist" aria-label="{{@inf.orbit.tabs}}">
      <button type="button" role="tab" aria-selected="true" data-tab="0">Instagram</button>
      <button type="button" role="tab" aria-selected="false" data-tab="1">Telegram</button>
      <button type="button" role="tab" aria-selected="false" data-tab="2">TikTok</button>
    </div>
    </div>
    </div>
    </section>
  </main>

{{> footer}}
</div>

<script src="{{root}}assets/js/transition.js" defer></script>
<script src="{{root}}assets/js/landing.js" defer></script>
<script src="{{root}}assets/js/orbit.js" defer></script>
</body>
</html>
