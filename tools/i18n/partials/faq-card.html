          <div class="tq-glass tq-glass--row" data-faq-card="" style="position: relative;">
            <span data-faq-edge aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, #ff5d62 0%, #e7131b 42%, #9e0b11 100%); box-shadow: 0 0 14px 1px rgba(231,19,27,.55); opacity: {{edge}}; transition: opacity .3s ease;"></span>
            <button type="button" data-faq-toggle aria-controls="{{id}}-a" id="{{id}}-q" aria-expanded="{{open}}" style="width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr) 24px; gap: 20px; align-items: center; padding: clamp(20px, 2.2vw, 28px) clamp(20px, 2.6vw, 32px); border: 0; background: transparent; color: #0a0a0a; text-align: left; cursor: pointer;">
              <span style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); background: radial-gradient(60% 45% at 34% 22%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 70%), linear-gradient(150deg, rgba(255,255,255,0) 48%, rgba(0,0,0,.22) 48.5%, rgba(0,0,0,.08) 100%), linear-gradient(30deg, rgba(120,6,10,.55) 0%, rgba(120,6,10,0) 45%), linear-gradient(180deg, #ff3a40 0%, #e7131b 50%, #b30e14 100%); color: #fff; font-size: 14px; font-weight: 700; letter-spacing: -.01em; text-shadow: 0 1px 2px rgba(90,0,4,.55);">{{nn}}</span>
              <span style="font-size: clamp(18px, 1.8vw, 23px); line-height: 1.25; letter-spacing: -.025em; font-weight: 600; color: #0a0a0a; text-wrap: pretty;">{{q}}</span>
              <svg data-faq-chev aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate({{rot}}deg); transition: transform .35s cubic-bezier(.2,.8,.2,1);"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <div data-faq-panel id="{{id}}-a" role="region" aria-labelledby="{{id}}-q" style="display: grid; grid-template-rows: {{rows}}; transition: grid-template-rows .4s cubic-bezier(.2,.8,.2,1);">
              <div style="overflow: hidden;">
                <p style="margin: 0; padding: 0 clamp(20px, 2.6vw, 32px) clamp(22px, 2.4vw, 28px) calc(clamp(20px, 2.6vw, 32px) + 60px); max-width: 64ch; font-size: clamp(15px, 1.3vw, 17px); line-height: 1.6; color: #5b5b5b; text-wrap: pretty;">{{a}}</p>
              </div>
            </div>
          </div>
