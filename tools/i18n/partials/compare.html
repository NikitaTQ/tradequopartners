<!-- Other programs vs TradeQuo (the owner's design, November 2026; the same on /programs/ and /partner-terms/): on wide
     screens a table, the TradeQuo column on a glass card; on phones (up to 899px) only the card, with its CTA, in one
     screen. Styles: site.css, "the comparison". Icons: assets/compare/ (tools/compare/make.py). -->
<div class="tq-cmp">
    <div class="tq-cmp__card" aria-hidden="true"></div>
    <i class="tq-cmp__band" data-row="1" style="grid-row: 2;"></i><i class="tq-cmp__band2" data-row="1" style="grid-row: 2;"></i>
    <i class="tq-cmp__band" data-row="2" style="grid-row: 3;"></i><i class="tq-cmp__band2" data-row="2" style="grid-row: 3;"></i>
    <i class="tq-cmp__band" data-row="3" style="grid-row: 4;"></i><i class="tq-cmp__band2" data-row="3" style="grid-row: 4;"></i>
    <i class="tq-cmp__band" data-row="4" style="grid-row: 5;"></i><i class="tq-cmp__band2" data-row="4" style="grid-row: 5;"></i>
    <i class="tq-cmp__band" data-row="5" style="grid-row: 6;"></i><i class="tq-cmp__band2" data-row="5" style="grid-row: 6;"></i>
    <i class="tq-cmp__band" data-row="6" style="grid-row: 7;"></i><i class="tq-cmp__band2" data-row="6" style="grid-row: 7;"></i>
    <div class="tq-cmp__oh"><b>{{cmp.other}}</b><span>{{cmp.sel}}</span></div>
    <div class="tq-cmp__th"><img src="{{root}}assets/logo-wordmark-dark.png" alt="TradeQuo" width="525" height="71" loading="lazy" decoding="async"><span>{{cmp.ours}}</span></div>
    <span class="tq-cmp__n" data-row="1" style="grid-row: 2;">01</span><span class="tq-cmp__l" data-row="1" style="grid-row: 2;">{{cmp.1.l}}</span><span class="tq-cmp__o" data-row="1" style="grid-row: 2;">{{cmp.1.o}}</span>
    <div class="tq-cmp__t" data-row="1" style="grid-row: 2;"><img src="{{root}}assets/compare/tiers.webp" alt="" width="68" height="68" loading="lazy" decoding="async"><span><b>{{cmp.1.t}}</b></span></div>
    <span class="tq-cmp__n" data-row="2" style="grid-row: 3;">02</span><span class="tq-cmp__l" data-row="2" style="grid-row: 3;">{{cmp.2.l}}</span><span class="tq-cmp__o" data-row="2" style="grid-row: 3;">{{cmp.2.o}}</span>
    <div class="tq-cmp__t" data-row="2" style="grid-row: 3;"><img src="{{root}}assets/compare/share.webp" alt="" width="68" height="68" loading="lazy" decoding="async"><span><b>{{cmp.2.t}}</b></span></div>
    <span class="tq-cmp__n" data-row="3" style="grid-row: 4;">03</span><span class="tq-cmp__l" data-row="3" style="grid-row: 4;">{{cmp.3.l}}</span><span class="tq-cmp__o" data-row="3" style="grid-row: 4;">{{cmp.3.o}}</span>
    <div class="tq-cmp__t" data-row="3" style="grid-row: 4;"><img src="{{root}}assets/compare/shield.webp" alt="" width="68" height="68" loading="lazy" decoding="async"><span><b>{{cmp.3.t}}</b><small>{{cmp.3.s}}</small></span></div>
    <span class="tq-cmp__n" data-row="4" style="grid-row: 5;">04</span><span class="tq-cmp__l" data-row="4" style="grid-row: 5;">{{cmp.4.l}}</span><span class="tq-cmp__o" data-row="4" style="grid-row: 5;">{{cmp.4.o}}</span>
    <div class="tq-cmp__t" data-row="4" style="grid-row: 5;"><img src="{{root}}assets/compare/daily.webp" alt="" width="68" height="68" loading="lazy" decoding="async"><span><b>{{cmp.4.t}}</b></span></div>
    <span class="tq-cmp__n" data-row="5" style="grid-row: 6;">05</span><span class="tq-cmp__l" data-row="5" style="grid-row: 6;">{{cmp.5.l}}</span><span class="tq-cmp__o" data-row="5" style="grid-row: 6;">{{cmp.5.o}}</span>
    <div class="tq-cmp__t" data-row="5" style="grid-row: 6;"><img src="{{root}}assets/compare/tv.webp" alt="" width="68" height="68" loading="lazy" decoding="async"><span><b>{{cmp.5.t}}</b><small>{{cmp.5.s}}</small></span></div>
    <span class="tq-cmp__n" data-row="6" style="grid-row: 7;">06</span><span class="tq-cmp__l" data-row="6" style="grid-row: 7;">{{cmp.6.l}}</span><span class="tq-cmp__o" data-row="6" style="grid-row: 7;">{{cmp.6.o}}</span>
    <div class="tq-cmp__t" data-row="6" style="grid-row: 7;"><img src="{{root}}assets/compare/trips.webp" alt="" width="68" height="68" loading="lazy" decoding="async"><span><b>{{cmp.6.t}}</b></span></div>
    <a class="tq-cmp__go" href="{{signupHref}}"{{signupNav}}><span class="tq-cmp__plus" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M10 3v14M3 10h14" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg></span><span class="tq-cmp__go-l">{{nav.cta}}</span><svg class="tq-cmp__chev" viewBox="0 0 12 21" aria-hidden="true"><path d="M2 2l8 8.5L2 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
</div>
