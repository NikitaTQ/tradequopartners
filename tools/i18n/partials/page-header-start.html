<header class="tq-head{{headClass}}" style="position: relative; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 22px clamp(16px, 4vw, 56px); max-width: 1440px; margin: 0 auto;">
    <a href="{{home}}" data-page-link data-label="{{@loader}} · {{@fan.home}}" style="display: inline-flex; flex-shrink: 0;"><img src="{{root}}assets/{{logoFile}}" alt="TradeQuo" style="height: 23px; width: auto;"></a>
    <nav style="display: flex; align-items: center; gap: clamp(14px, 2vw, 32px); flex-wrap: wrap; justify-content: flex-end;">
      <span data-navlinks="" style="display: contents;">
        {{siteNav}}
