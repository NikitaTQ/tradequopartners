<!-- Revenue-share calculator: the two controls, the payout statement (Day / Month / Year), the note and the
     liquid CTA. Shared by the landing (under its own heading) and commission-plan/ (under the page's h1);
     startCalculator in landing.js drives it. The CTA goes to the form: on the landing it scrolls, from
     commission-plan/ it opens the landing (signupHref / signupNav in build-i18n.py). -->
    <div data-calc-grid="" style="max-width: 1240px; margin: clamp(26px, 4vw, 48px) auto 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: clamp(18px, 2.4vw, 32px); align-items: stretch;">
      <div data-calc-glass="" style="position: relative; display: flex; isolation: isolate;">
      <div class="tq-calc" data-calc-controls="">
        <div class="tq-calc__field">
          <div class="tq-calc__head">
            <span class="tq-calc__ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"></path><path d="m3 12 9 5 9-5"></path><path d="m3 16 9 5 9-5"></path></svg></span>
            <span class="tq-calc__title">{{calc.lots}}</span>
          </div>
          <label class="tq-calc__val">
            <span class="tq-calc__sheen" data-calc-sheen="" aria-hidden="true" style="left: 11.9%;"></span>
            <input class="tq-calc__input" type="number" inputmode="numeric" min="10" max="5000" aria-label="{{@calc.lots}}" data-calc-input="lots" value="130">
            <span class="tq-calc__unit">{{calc.lotsUnit}}</span>
          </label>
          <div class="tq-calc__slider" data-calc-slider="lots">
            <span class="tq-calc__track"></span>
            <span class="tq-calc__fill" data-calc-fill="" style="width: calc(2.40% - 2px);"></span>
            <span class="tq-calc__knob" data-calc-knob="" style="left: 2.40%;"></span>
          </div>
        </div>
        <div class="tq-calc__field">
          <div class="tq-calc__head">
            <span class="tq-calc__ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><path d="M15.5 4.8a3.5 3.5 0 0 1 0 6.4"></path><path d="M18 14.8c1.8.8 3 2.6 3.5 5.2"></path></svg></span>
            <span class="tq-calc__title">{{calc.traders}}</span>
          </div>
          <label class="tq-calc__val">
            <span class="tq-calc__sheen" data-calc-sheen="" aria-hidden="true" style="left: 25.8%;"></span>
            <input class="tq-calc__input" type="number" inputmode="numeric" min="1" max="300" aria-label="{{@calc.traders}}" data-calc-input="traders" value="60">
            <span class="tq-calc__unit">{{calc.tradersUnit}}</span>
          </label>
          <div class="tq-calc__slider" data-calc-slider="traders">
            <span class="tq-calc__track"></span>
            <span class="tq-calc__fill" data-calc-fill="" style="width: calc(19.73% - 2px);"></span>
            <span class="tq-calc__knob" data-calc-knob="" style="left: 19.73%;"></span>
          </div>
        </div>
      </div>

      </div>
      <div data-ref="inv" data-invoice="" style="position: relative; padding: clamp(26px, 3.2vw, 42px) clamp(22px, 3.2vw, 42px) clamp(24px, 3vw, 36px); border-radius: 4px; background: linear-gradient(180deg, #fdfdfb 0%, #f7f7f4 100%); box-shadow: 0 1px 0 #e9e9e5, 0 44px 80px -42px rgba(10,10,10,.34), 0 2px 8px rgba(10,10,10,.06); display: flex; flex-direction: column; gap: 20px; overflow: hidden;">
        <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 4px; background: #e7131b;"></div>

        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;">
          <span style="display: flex; align-items: center; gap: 9px;"><img src="{{root}}assets/logo-mark.png" alt="" style="height: 24px; width: auto;"><span style="font-size: 19px; font-weight: 600; letter-spacing: -.035em; color: #0a0a0a;">TradeQuo<span style="color: #e7131b;">.</span></span></span>
          <span style="font-family: 'Cormorant Garamond', serif; font-size: clamp(30px, 3.4vw, 40px); line-height: .9; letter-spacing: .06em; font-weight: 500; color: #0a0a0a;">{{inv.title}}</span>
        </div>

        <div data-inv-meta="" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 14px 0; border-top: 1px solid #e4e4e1; border-bottom: 1px solid #e4e4e1;">
          <div style="display: flex; flex-direction: column; gap: 5px;"><span style="font-size: 9.5px; font-weight: 600; letter-spacing: .2em; color: #8a8a8e;">{{inv.no}}</span><span style="font-family: 'Fragment Mono', monospace; font-size: 12.5px; color: #0a0a0a;"><span data-inv-no></span></span></div>
          <div style="display: flex; flex-direction: column; gap: 5px;"><span style="font-size: 9.5px; font-weight: 600; letter-spacing: .2em; color: #8a8a8e;">{{inv.issued}}</span><span style="font-family: 'Fragment Mono', monospace; font-size: 12.5px; color: #0a0a0a;"><span data-inv-issued></span></span></div>
          <div style="display: flex; flex-direction: column; gap: 5px;"><span style="font-size: 9.5px; font-weight: 600; letter-spacing: .2em; color: #8a8a8e;">{{inv.period}}</span><span style="font-family: 'Fragment Mono', monospace; font-size: 12.5px; color: #0a0a0a;"><span data-inv-period></span></span></div>
        </div>

        <div style="display: flex; flex-direction: column;">
          <div style="display: flex; justify-content: space-between; gap: 16px; padding-bottom: 10px; border-bottom: 1px solid #e4e4e1;"><span style="font-size: 9.5px; font-weight: 600; letter-spacing: .2em; color: #8a8a8e;">{{inv.desc}}</span><span style="font-size: 9.5px; font-weight: 600; letter-spacing: .2em; color: #8a8a8e;">{{inv.amount}}</span></div>
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 14px 0; border-bottom: 1px dashed #e0e0dc;">
            <span style="display: flex; flex-direction: column; gap: 5px; min-width: 0;">
              <span style="font-size: 15px; font-weight: 600; letter-spacing: -.01em; color: #0a0a0a;">{{inv.rebate}}</span>
              <span style="font-family: 'Fragment Mono', monospace; font-size: 11.5px; color: #6a6a6e;">{{inv.rebateCalc}}</span>
            </span>
            <span data-inv-money="" style="font-family: 'Fragment Mono', monospace; font-size: 12.5px; color: #0a0a0a; font-size: 14px; white-space: nowrap;"></span>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 14px 0; border-bottom: 1px solid #e4e4e1;">
            <span style="display: flex; flex-direction: column; gap: 5px;">
              <span style="font-size: 15px; font-weight: 600; letter-spacing: -.01em; color: #0a0a0a;">{{inv.fees}}</span>
              <span style="font-family: 'Fragment Mono', monospace; font-size: 11.5px; color: #6a6a6e;">{{inv.feesNote}}</span>
            </span>
            <span style="font-family: 'Fragment Mono', monospace; font-size: 12.5px; color: #0a0a0a; font-size: 14px; white-space: nowrap;">$0.00</span>
          </div>
        </div>

        <div style="position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;">
          <svg data-inv-stamp="" aria-hidden="true" width="118" height="118" viewBox="0 0 120 120" style="flex-shrink: 0; transform: rotate(-14deg); opacity: .8; mix-blend-mode: multiply; pointer-events: none; margin: -6px 0 -10px -4px;">
            <defs><path id="invArc" d="M60,60 m-42,0 a42,42 0 1,1 84,0 a42,42 0 1,1 -84,0"></path></defs>
            <circle cx="60" cy="60" r="56" fill="none" stroke="#e7131b" stroke-width="2.4"></circle>
            <circle cx="60" cy="60" r="31" fill="none" stroke="#e7131b" stroke-width="1.2"></circle>
            <text font-family="DM Sans, sans-serif" font-size="9.6" font-weight="700" letter-spacing="2" fill="#e7131b" direction="ltr" unicode-bidi="embed"><textPath href="#invArc">PAID DAILY · TRADEQUO · PARTNER ·</textPath></text>
            <text x="60" y="66" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="17" font-weight="800" letter-spacing="1.5" fill="#e7131b">PAID</text>
          </svg>
          <div data-inv-totals="" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; min-width: 0;">
            <div data-inv-per="" role="group" aria-label="{{@inv.period}}"><span data-inv-per-thumb="" aria-hidden="true"></span><button type="button" data-per="day" aria-pressed="false">{{inv.pDay}}</button><button type="button" data-per="month" aria-pressed="true">{{inv.pMonth}}</button><button type="button" data-per="year" aria-pressed="false">{{inv.pYear}}</button></div>
            <span data-inv-money="" data-inv-total="" style="font-family: 'DM Sans', sans-serif; font-size: clamp(38px, 4.6vw, 56px); line-height: 1; letter-spacing: -.04em; font-weight: 700; color: #0a0a0a; font-variant-numeric: tabular-nums; white-space: nowrap; transition: color .5s ease;"></span>
          </div>
        </div>

      </div>
    </div>
    <p data-calc-note style="max-width: 1240px; margin: clamp(16px, 2vw, 24px) auto 0; font-size: 12.5px; line-height: 1.55; color: #8a8a8e; text-align: center; text-wrap: pretty;">{{calc.note}}</p>
    <div data-calc-cta="" style="display: flex; justify-content: center; margin: clamp(34px, 4vw, 52px) 0 max(20px, calc(130px - 8vw));">
      <a class="tq-liq" href="{{signupHref}}"{{signupNav}} aria-label="{{@calc.cta}}"><span class="tq-liq__shadow" aria-hidden="true"></span><span class="tq-liq__body"><span class="tq-liq__well" aria-hidden="true"><span class="tq-liq__fluid"><span class="tq-liq__wave"><svg viewBox="0 0 400 20" preserveAspectRatio="none" width="100%" height="10" focusable="false"><path d="M0 12 Q 50 2 100 12 T 200 12 T 300 12 T 400 12 V 20 H 0 Z" fill="#FF6A70"></path></svg></span><span class="tq-liq__line"></span></span></span><span class="tq-liq__gloss" aria-hidden="true"></span><span class="tq-liq__label">{{calc.cta}}<span class="tq-liq__arr">→</span></span><span class="tq-liq__label tq-liq__label--lit" aria-hidden="true">{{calc.cta}}<span>→</span></span></span></a>
    </div>
