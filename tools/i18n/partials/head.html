<link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{root}}favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="{{root}}apple-touch-icon.png">
<script>/* loader veil on arrival; visitor's "no auto-translate" choice (set in the language menu) */
try{if(sessionStorage.getItem('tqLoader'))document.documentElement.classList.add('tq-arriving')}catch(e){}
try{if(localStorage.getItem('tqNoTranslate')){var d=document.documentElement,m=document.createElement('meta');d.setAttribute('translate','no');d.classList.add('notranslate');m.name='google';m.content='notranslate';document.head.appendChild(m)}}catch(e){}</script>
<link rel="preload" href="{{root}}assets/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>{{fontPreload}}
<link rel="stylesheet" href="{{root}}assets/css/site.css" data-inline>{{pageCss}}{{fontFaces}}
