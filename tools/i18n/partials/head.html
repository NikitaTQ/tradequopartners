<link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{root}}favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="{{root}}apple-touch-icon.png">
<script>/* the visitor's "no auto-translate" choice (set in the language menu) */
try{if(localStorage.getItem('tqNoTranslate')){var d=document.documentElement,m=document.createElement('meta');d.setAttribute('translate','no');d.classList.add('notranslate');m.name='google';m.content='notranslate';document.head.appendChild(m)}}catch(e){}</script>
<script>/* UTM tags from the link the visitor came by, kept 30 days (cookie tq_utm, set here and again by the server: netlify/edge-functions/utm.js) and sent with the form (README: UTM) */
try{var q=new URLSearchParams(location.search),u={},h=0;['utm_source','utm_medium','utm_campaign','utm_term','utm_content'].forEach(function(n){var v=q.get(n);if(v){u[n]=v.slice(0,200);h=1}});if(h)document.cookie='tq_utm='+encodeURIComponent(JSON.stringify(u))+';max-age=2592000;path=/;SameSite=Lax'+(location.protocol=='https:'?';Secure':'');if(window.fetch)fetch('/api/utm?'+new URLSearchParams(u),{keepalive:true}).catch(function(){})}catch(e){}</script>
