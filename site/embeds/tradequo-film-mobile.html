// TradeQuo glass logo — offscreen renderer driven frame-by-frame by the film clock.
import * as THREE from 'https://unpkg.com/three@0.184.0/build/three.module.js';

class TQGlassRenderer {
  constructor(w = 1600, h) {
    const T = THREE, RW = Math.round(w), RH = Math.round(h || w * 9 / 16);
    const R = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
    R.setPixelRatio(1);
    R.setSize(RW, RH, false);
    R.outputColorSpace = T.SRGBColorSpace;
    R.toneMapping = T.NoToneMapping;
    this.R = R; this.canvas = R.domElement; this.W = RW; this.H = RH;
    this.scene = new T.Scene();
    this.cam = new T.PerspectiveCamera(26, RW / RH, 0.1, 200);
    this.pivot = new T.Group(); this.scene.add(this.pivot);
    this.logo = new T.Group(); this.pivot.add(this.logo);

    const s = 1 / 20, cx = 100.75, cy = 100;
    const P = (x, y) => [(x - cx) * s, (cy - y) * s];
    const tab = new T.Shape();
    const [ax, ay] = P(48, 58.5);
    tab.moveTo(ax, ay); tab.lineTo(...P(68.5, 58.5));
    tab.absarc(ax, ay, 20.5 * s, 0, -Math.PI / 2, true);
    tab.lineTo(ax, ay);
    const tt = new T.Shape();
    tt.moveTo(...P(104.5, 58.5)); tt.lineTo(...P(153.5, 58.5)); tt.lineTo(...P(133, 79)); tt.lineTo(...P(110, 79));
    tt.lineTo(...P(110, 120)); tt.lineTo(...P(89.5, 140.5)); tt.lineTo(...P(89.5, 77));
    tt.quadraticCurveTo(...P(93, 61), ...P(104.5, 58.5));
    const depth = 0.72;
    const geo = new T.ExtrudeGeometry([tab, tt], { depth, bevelEnabled: true, bevelThickness: 0.13, bevelSize: 0.075, bevelOffset: -0.075, bevelSegments: 10, curveSegments: 64 });
    geo.translate(0, 0, -depth / 2);

    const glass = new T.MeshPhysicalMaterial({
      color: 0xffffff, metalness: 0, roughness: 0.03, transmission: 1, thickness: 0.5, ior: 1.45, dispersion: 0.3,
      specularIntensity: 1, clearcoat: 1, clearcoatRoughness: 0.03,
      attenuationColor: new T.Color('#ffffff'), attenuationDistance: Infinity, envMapIntensity: 1.6,
    });
    const red = new T.MeshPhysicalMaterial({
      color: new T.Color('#E42320'), metalness: 0, roughness: 0.05, transmission: 0.7, thickness: 1.05, ior: 1.5,
      attenuationColor: new T.Color('#FF2A22'), attenuationDistance: 0.5, clearcoat: 1, clearcoatRoughness: 0.03,
      emissive: new T.Color('#E42320'), emissiveIntensity: 0.35, envMapIntensity: 1.2,
    });
    this.logo.add(new T.Mesh(geo, glass));
    this.dot = new T.Mesh(new T.SphereGeometry(10.5 * s, 96, 64), red);
    const [dx, dy] = P(141, 130.5);
    this.dotBase = new T.Vector3(dx, dy, 0);
    this.dot.position.copy(this.dotBase);
    this.logo.add(this.dot);

    // studio environment (dark theme of the landing logo)
    const es = new T.Scene();
    es.background = new T.Color(0x000000);
    const box = (w, h, x, y, z, k, col = '#ffffff') => {
      const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: new T.Color(col).multiplyScalar(k), side: T.DoubleSide }));
      m.position.set(x, y, z); m.lookAt(0, 0, 0); es.add(m);
    };
    box(16, 3, 0, 9, 2, 3.2); box(1.3, 14, -9, 0, 3, 2.4); box(1, 14, 9, 1, -2, 1.6); box(12, 0.7, 0, -1.5, -10, 1.5);
    box(5, 5, 6, 4, 9, 1.1); box(10, 6, 0, -9, 4, 0.35, '#9aa0a6'); box(12, 7, 0, 3, 11, 0.45); box(3, 9, -6, 2, 9, 2.2);
    const pm = new T.PMREMGenerator(R);
    this.scene.environment = pm.fromScene(es, 0.015).texture;
    pm.dispose();

    this.scene.background = this.backdrop(RW, RH);
    this.out = document.createElement('canvas');
    this.out.width = RW; this.out.height = RH;
    this.octx = this.out.getContext('2d');
  }

  backdrop(W, H) {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d'), u = Math.min(W, H) / 900 * (900 / 1024), cx = W / 2, cy = H / 2;
    x.fillStyle = '#050506'; x.fillRect(0, 0, W, H);
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, 520 * u);
    g.addColorStop(0, 'rgba(255,255,255,0.14)'); g.addColorStop(0.5, 'rgba(255,255,255,0.045)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    const band = (off, bw, al) => {
      const lg = x.createLinearGradient(-800, 0, 800, 0);
      lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, 'rgba(255,255,255,' + al + ')'); lg.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = lg; x.fillRect(-800, off, 1600, bw);
    };
    x.save(); x.translate(cx, cy); x.scale(u, u); x.rotate(-0.55); x.filter = 'blur(10px)';
    band(-130, 28, 0.34); band(-66, 8, 0.22); band(64, 18, 0.28); band(148, 5, 0.2);
    x.restore();
    x.filter = 'blur(40px)'; x.fillStyle = 'rgba(228,35,32,0.12)';
    x.beginPath(); x.arc(cx + 150 * u, cy + 120 * u, 140 * u, 0, Math.PI * 2); x.fill();
    x.filter = 'none';
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  // p: {ang, tilt, roll, camX, camY, camZ, dotOn, dotScale, dotX, dotY, dotZ}
  render(p) {
    this.logo.rotation.y = p.ang;
    this.pivot.rotation.x = p.tilt;
    this.pivot.rotation.z = p.roll;
    this.cam.position.set(p.camX, p.camY, p.camZ);
    this.cam.lookAt(p.camX, p.camY, 0);
    this.dot.visible = !!p.dotOn && p.dotScale > 0.001;
    this.dot.scale.setScalar(Math.max(0.001, p.dotScale));
    this.dot.position.set(this.dotBase.x + p.dotX, this.dotBase.y + p.dotY, p.dotZ);
    this.R.render(this.scene, this.cam);
  }

  // flat JPEG of the last render (optionally blurred) — what the video exporter sees
  snapshot(blur) {
    const x = this.octx;
    x.fillStyle = '#050506'; x.fillRect(0, 0, this.W, this.H);
    x.filter = blur > 0.05 ? 'blur(' + blur.toFixed(2) + 'px)' : 'none';
    x.drawImage(this.canvas, 0, 0);
    x.filter = 'none';
    return this.out.toDataURL('image/jpeg', 0.92);
  }
}

window.TQGlassRenderer = TQGlassRenderer;
window.dispatchEvent(new Event('tqglass-ready'));

</script>

const RED = '#E7131B';

const MOTION = {
  enter: Easing.easeOutCubic, glide: Easing.easeInOutCubic, pop: Easing.easeOutBack,
  settle: Easing.easeOutSine, sway: Easing.easeInOutSine, fall: Easing.easeInQuad, exit: Easing.easeInCubic,

const tw = (T, a, b, from, to, e = MOTION.glide) => animate({ from, to, start: a, end: b, ease: e })(T);
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (T, a, b) => clamp((T - a) / (b - a), 0, 1);
const bell = (T, a, b) => (T <= a || T >= b ? 0 : Math.sin(Math.PI * (T - a) / (b - a)));
const proj = (cam, X, Y, Z) => { const s = (H / 2) / ((cam.z - Z) * TAN); return { x: W / 2 + (X - cam.x) * s, y: H / 2 - (Y - cam.y) * s, s }; };
const money = (n) => '$' + Math.round(n).toLocaleString('en-US');
const mono = { fontFamily: "'Fragment Mono', monospace" };

const NOISE = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), d = x.createImageData(256, 256);
  let s = 1234567;
  for (let i = 0; i < d.data.length; i += 4) { s = (s * 1103515245 + 12345) & 0x7fffffff; const v = s % 256; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0);
  return c.toDataURL('image/png');
})();

function useDataUrl(src, opts = {}) {
  const [url, setUrl] = useState(null);
  useEffect(() => {
    const im = new Image();
    im.onerror = () => setUrl(false);
    im.onload = () => {
      const c = document.createElement('canvas'), x = c.getContext('2d');
      const cx = opts.whiten || 0, w = im.width - cx, h = im.height;
      c.width = w; c.height = h;
      x.drawImage(im, cx, 0, w, h, 0, 0, w, h);
      if (opts.whiten) { x.globalCompositeOperation = 'source-in'; x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, w, h); }
      if (opts.vignette) {
        const gr = x.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.min(w, h) / 2);
        gr.addColorStop(0, '#000'); gr.addColorStop(0.62, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)');
        x.globalCompositeOperation = 'destination-in'; x.fillStyle = gr; x.fillRect(0, 0, w, h);
      }
      setUrl(c.toDataURL('image/png'));
    };
    im.src = (window.TQ_ASSETS && window.TQ_ASSETS[src]) || src;
  }, [src]);
  return url;
}

// ── 3D glass logo layer ─────────────────────────────────────────────────────
function GlassLayer({ params, blur, off }) {
  const { playing } = useComposition();
  const hostRef = useRef(null), imgRef = useRef(null), rRef = useRef(null);
  const [ready, setReady] = useState(!!window.TQGlassRenderer);
  useEffect(() => {
    if (ready) return;
    const on = () => setReady(true);
    window.addEventListener('tqglass-ready', on);
    if (window.TQGlassRenderer) setReady(true);
    return () => window.removeEventListener('tqglass-ready', on);
  }, []);
  useLayoutEffect(() => {
    if (!ready || rRef.current || !hostRef.current) return;
    const r = new window.TQGlassRenderer(window.TQ_RENDER_W_M || 1080, window.TQ_RENDER_H_M || 1920);
    r.canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block;';
    hostRef.current.appendChild(r.canvas);
    rRef.current = r;
  }, [ready]);
  useLayoutEffect(() => {
    const r = rRef.current, img = imgRef.current;
    if (!r || !img) return;
    if (off) { img.style.visibility = 'hidden'; return; }
    r.render(params);
    r.canvas.style.filter = blur > 0.05 ? 'blur(' + blur.toFixed(2) + 'px)' : 'none';
    if (playing) { img.style.visibility = 'hidden'; return; }
    img.src = r.snapshot(blur * r.W / W);
    img.style.visibility = 'visible';
  });
  return (
    <div style={{ position: 'absolute', inset: 0, background: '#050506' }}>
      <div ref={hostRef} style={{ position: 'absolute', inset: 0 }}></div>
      <img ref={imgRef} alt="" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', visibility: 'hidden' }} />
    </div>
  );
}

      WebkitBackdropFilter: 'blur(10px)', backdropFilter: 'blur(10px)', boxShadow: '0 6px 18px -6px rgba(0,0,0,0.45)', transition: 'transform .15s ease, background .15s ease',

      <div ref={wrap} onPointerDown={reveal} onMouseEnter={function () { setHover(true); }} onMouseLeave={function () { setHover(false); }} style={{ position: 'absolute', inset: 0, overflow: 'hidden', background: 'transparent' }}>
        <div style={{ position: 'absolute', left: (box.w - 1080 * sc) / 2, top: (box.h - 1920 * sc) / 2, width: 1080, height: 1920, transformOrigin: '0 0', transform: 'scale(' + sc + ')' }}>

          <span style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>

            {paused
