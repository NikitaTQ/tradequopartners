<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradeQuo partner program art — embed</title>
<!--
  3D art for the Partner Programs cards (from the 3D_Refer_Chain / 3D_Partner_Network /
  3D_White_Label_Flag designs). ?obj=link | network | flag picks the object.
  ?still renders one frame and stops (used for the posters: tools/render-program-posters.mjs).
  The page sets window.__tqPaused while the card is off screen; the first drawn frame posts
  {tqReady:true} so the page fades this frame in over its poster.
-->
<script type="importmap">
{
  "imports": { "three": "../vendor/three@0.184.0/three.module.min.js" },
  "integrity": {
    "../vendor/three@0.184.0/three.module.min.js": "sha384-35WaVqXNGvw49+RCXk67Ci9ebo55/5+CfirDbAVSG21KV8/7gO4xwIkhA5ZRcUHc",
    "../vendor/three@0.184.0/three.core.min.js": "sha384-/2vXInuUL2LKgd3n86c5RIzG+YC7vk3zYPTknaEkF2H2sauHtaOrS8swZ+MURxU6"
  }
}
</script>
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden} canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<canvas id="art"></canvas>
<script type="module">
import * as THREE from 'three';

const P = new URLSearchParams(location.search);
const OBJ = P.get('obj') || 'link';
const STILL = P.has('still');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEED = reduce ? 0.25 : 1;

function makeEnv(renderer) {
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(20, 20, 20), new THREE.MeshBasicMaterial({ color: 0x060607, side: THREE.BackSide })));
  const box = (w, h, pos, rgb) => {
    const m = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
    m.color.setRGB(...rgb);
    const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
    p.position.set(...pos); p.lookAt(0, 0, 0); env.add(p);
  };
  box(6, 2.2, [0, 7, 0.5], [8, 8, 8]);
  box(7, 2.5, [0, 3, 7], [3.2, 3.2, 3.3]);
  box(8, 1.2, [0, 2, -7], [5, 5, 5]);
  box(0.8, 9, [-7, 0.5, 2.5], [4, 4, 4.2]);
  box(0.5, 9, [7, 0.5, -1.5], [2.4, 2.4, 2.5]);
  box(12, 1.2, [0, -6.5, 2], [0.32, 0.02, 0.025]);
  const pm = new THREE.PMREMGenerator(renderer);
  const tex = pm.fromScene(env, 0.02).texture;
  pm.dispose();
  return tex;
}

const MAT = () => ({
  silver: Object.assign(new THREE.MeshStandardMaterial({ color: 0xD8D8DC, metalness: 1, roughness: 0.2 }), { name: 'polished_silver' }),
  satin: Object.assign(new THREE.MeshStandardMaterial({ color: 0xB9B9BE, metalness: 1, roughness: 0.42 }), { name: 'satin_silver' }),
  black: Object.assign(new THREE.MeshStandardMaterial({ color: 0x232328, metalness: 0.7, roughness: 0.3 }), { name: 'black_anodized' }),
  matte: Object.assign(new THREE.MeshStandardMaterial({ color: 0x2E2E33, metalness: 0.5, roughness: 0.5 }), { name: 'matte_black' }),
  red: Object.assign(new THREE.MeshStandardMaterial({ color: 0xD0121B, metalness: 0.75, roughness: 0.26 }), { name: 'red_anodized' }),
  led: Object.assign(new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0xFFFFFF, emissiveIntensity: 0.6 }), { name: 'led' }),
});

function rig(scene) {
  const key = new THREE.DirectionalLight(0xffffff, 2.6); key.position.set(-3, 5, 4); scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.9); fill.position.set(4, 1.5, 3); scene.add(fill);
  const back = new THREE.DirectionalLight(0xffffff, 3.2); back.position.set(0.5, 3, -5); scene.add(back);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x222226, 0.6));
  const under = new THREE.PointLight(0xff2a30, 0.9, 5, 2); under.position.set(0, -2.2, -0.6); scene.add(under);
}

function contactShadow(scene, w, d, y) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(0,0,0,0.75)'); gr.addColorStop(0.55, 'rgba(0,0,0,0.25)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  m.name = 'contact_shadow'; m.rotation.x = -Math.PI / 2; m.position.y = y; scene.add(m);
  return m;
}

function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

const clamp01 = x => Math.min(1, Math.max(0, x));
const easeOutBack = x => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);


/* 01 · Refer traders: the chain is lifted by the red-sleeved link; outer links fold and swing */
function buildLink(scene, camera, M) {
  camera.fov = 22; camera.position.set(0.4, 1.7, 6.4); camera.lookAt(0, -0.05, 0);
  const root = new THREE.Group(); root.name = 'referral_chain'; root.position.y = -0.2; scene.add(root);
  const pts = [];
  for (let i = 0; i < 96; i++) {
    const a = (i / 96) * Math.PI * 2, c = Math.cos(a), s = Math.sin(a), n = 3.2;
    pts.push(new THREE.Vector3(0.62 * Math.sign(c) * Math.abs(c) ** (2 / n), 0.34 * Math.sign(s) * Math.abs(s) ** (2 / n), 0));
  }
  const geo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true), 260, 0.1, 40, true);
  const mid = new THREE.Group(); mid.name = 'lifted_link'; root.add(mid);
  const linkMid = new THREE.Mesh(geo, M.silver); linkMid.name = 'link_mid'; linkMid.rotation.x = Math.PI / 2; mid.add(linkMid);
  const sleeveGeo = new THREE.CylinderGeometry(0.128, 0.128, 0.46, 48); sleeveGeo.rotateZ(Math.PI / 2);
  const sleeve = new THREE.Mesh(sleeveGeo, M.red); sleeve.name = 'red_sleeve'; sleeve.position.set(0, 0.34, 0); linkMid.add(sleeve);
  const rimGeo = new THREE.TorusGeometry(0.128, 0.012, 12, 48); rimGeo.rotateY(Math.PI / 2);
  [-0.23, 0.23].forEach(x => { const e = new THREE.Mesh(rimGeo, M.silver); e.name = 'sleeve_rim'; e.position.set(x, 0.34, 0); linkMid.add(e); });
  const pivots = [-1, 1].map(sd => {
    const p = new THREE.Group(); p.name = 'pivot_' + (sd < 0 ? 'l' : 'r'); p.position.x = sd * 0.5; mid.add(p);
    const l = new THREE.Mesh(geo, M.black); l.name = 'link_' + (sd < 0 ? 'l' : 'r'); l.position.x = sd * 0.36; p.add(l);
    return { p, sd };
  });
  const shadow = contactShadow(scene, 3.6, 1.6, -0.66);
  return t => {
    const T = 3.4, ph = (t % T) / T;
    const lift = Math.pow(Math.sin(ph * Math.PI), 1.6);
    const vel = Math.cos(ph * Math.PI);
    mid.position.y = lift * 0.5;
    mid.rotation.z = Math.sin(t * 2.4) * 0.05 * lift;
    pivots.forEach(({ p, sd }) => {
      const ang = lift * 0.8 - vel * 0.22 * lift + Math.sin(t * 4.4 + sd) * 0.08 * lift;
      p.rotation.z = -sd * ang;
      p.rotation.x = Math.sin(t * 2.2 + sd * 1.3) * 0.18 * lift;
    });
    root.rotation.y = -0.45 + Math.sin(t * 0.7) * 0.35;
    shadow.scale.setScalar(1 - lift * 0.3);
    shadow.material.opacity = 1 - lift * 0.5;
  };
}

/* 02 · Build a network: you at the core, two counter-rotating tiers, links re-route to the nearest partner */
function buildNetwork(scene, camera, M) {
  camera.fov = 24; camera.position.set(0, 3.4, 5.6); camera.lookAt(0, -0.15, 0);
  const root = new THREE.Group(); root.name = 'partner_network'; root.scale.setScalar(0.92); scene.add(root);
  const hub = new THREE.Mesh(new THREE.SphereGeometry(0.3, 64, 48), M.silver); hub.name = 'you'; root.add(hub);
  const band = new THREE.Mesh(new THREE.TorusGeometry(0.302, 0.03, 16, 96), M.red); band.name = 'you_band'; band.rotation.x = Math.PI / 2; root.add(band);
  const mkTier = (R, tilt, count, geo, mat, name) => {
    const g = new THREE.Group(); g.name = name; g.rotation.set(tilt[0], 0, tilt[1]); root.add(g);
    const orbit = new THREE.Mesh(new THREE.TorusGeometry(R, 0.007, 8, 240), M.satin); orbit.name = name + '_orbit'; g.add(orbit);
    const spin = new THREE.Group(); g.add(spin);
    const nodes = [];
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2;
      const n = new THREE.Mesh(geo, mat); n.name = name + '_node_' + i; n.position.set(Math.cos(a) * R, Math.sin(a) * R, 0); spin.add(n); nodes.push(n);
    }
    return { spin, nodes };
  };
  const t1 = mkTier(1.0, [Math.PI / 2 - 0.42, 0.22], 4, new THREE.SphereGeometry(0.13, 48, 32), M.black, 'partners');
  const t2 = mkTier(1.62, [Math.PI / 2 - 0.3, -0.3], 7, new THREE.SphereGeometry(0.075, 32, 24), M.silver, 'sub_partners');
  const rodGeo = new THREE.CylinderGeometry(0.009, 0.009, 1, 8); rodGeo.translate(0, 0.5, 0); rodGeo.rotateX(Math.PI / 2);
  const mkRod = () => { const r = new THREE.Mesh(rodGeo, M.satin); r.name = 'link'; scene.add(r); return r; };
  const rods1 = t1.nodes.map(mkRod), rods2 = t2.nodes.map(mkRod);
  const beads = t2.nodes.map((n, i) => { const b = new THREE.Mesh(new THREE.SphereGeometry(0.026, 16, 12), M.silver); b.name = 'transfer'; scene.add(b); return { b, ph: i / t2.nodes.length }; });
  const P1 = t1.nodes.map(() => new THREE.Vector3()), P2 = t2.nodes.map(() => new THREE.Vector3()), H = new THREE.Vector3();
  const place = (rod, A, B) => { rod.position.copy(A); rod.lookAt(B); rod.scale.set(1, 1, A.distanceTo(B)); };
  contactShadow(scene, 3.2, 3.2, -0.75);
  return t => {
    t1.spin.rotation.z = t * 0.5;
    t2.spin.rotation.z = -t * 0.3;
    root.rotation.y = Math.sin(t * 0.3) * 0.25;
    scene.updateMatrixWorld(true);
    hub.getWorldPosition(H);
    t1.nodes.forEach((n, i) => { n.getWorldPosition(P1[i]); place(rods1[i], P1[i], H); });
    const near = t2.nodes.map((n, i) => {
      n.getWorldPosition(P2[i]);
      let best = 0, bd = 1e9;
      P1.forEach((p, j) => { const d = p.distanceToSquared(P2[i]); if (d < bd) { bd = d; best = j; } });
      place(rods2[i], P2[i], P1[best]);
      return best;
    });
    beads.forEach((k, i) => {
      const q = (t * 0.35 + k.ph) % 1;
      if (q < 0.5) k.b.position.lerpVectors(P2[i], P1[near[i]], ease(q * 2));
      else k.b.position.lerpVectors(P1[near[i]], H, ease((q - 0.5) * 2));
    });
  };
}

/* 03 · Launch your brand: a building with your flag */
function buildFlag(scene, camera, M) {
  camera.fov = 24; camera.position.set(1.7, 0.7, 5.6); camera.lookAt(0.15, 0.05, 0);
  const root = new THREE.Group(); scene.add(root);
  const towerGeo = new THREE.ExtrudeGeometry(roundedRect(0.62, 0.62, 0.05), { depth: 1.15, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.015, bevelSegments: 3, curveSegments: 12 });
  towerGeo.center(); towerGeo.rotateX(-Math.PI / 2);
  const tower = new THREE.Mesh(towerGeo, M.black); tower.name = 'building'; tower.position.y = -0.38; root.add(tower);
  for (let i = 0; i < 7; i++) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.01, 0.006), M.satin); s.name = 'floor_line'; s.position.set(0, -0.86 + i * 0.15, 0.33); root.add(s);
    const s2 = s.clone(); s2.rotation.y = Math.PI / 2; s2.position.set(0.33, s.position.y, 0); root.add(s2);
  }
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.06, 0.9), M.satin); plinth.name = 'plinth'; plinth.position.y = -0.99; root.add(plinth);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.66, 16), M.silver); pole.name = 'pole'; pole.position.set(-0.18, 0.53, 0); root.add(pole);
  const finial = new THREE.Mesh(new THREE.SphereGeometry(0.03, 16, 12), M.silver); finial.position.set(-0.18, 0.87, 0); root.add(finial);
  const fw = 0.56, fh = 0.34;
  const flagGeo = new THREE.PlaneGeometry(fw, fh, 28, 14); flagGeo.translate(fw / 2, 0, 0);
  const base = flagGeo.attributes.position.array.slice();
  const cloth = Object.assign(new THREE.MeshStandardMaterial({ color: 0xC8101A, metalness: 0.1, roughness: 0.55, side: THREE.DoubleSide }), { name: 'flag_cloth' });
  const flag = new THREE.Mesh(flagGeo, cloth); flag.name = 'your_flag'; flag.position.set(-0.18, 0.66, 0); root.add(flag);
  contactShadow(scene, 1.8, 1.8, -1.02);
  return t => {
    const pa = flagGeo.attributes.position;
    for (let i = 0; i < pa.count; i++) {
      const x = base[i * 3], y = base[i * 3 + 1], k = x / fw;
      pa.setZ(i, Math.sin(x * 9 - t * 5.2 + y * 2) * 0.055 * k + Math.sin(x * 17 - t * 8) * 0.012 * k);
      pa.setY(i, y - k * k * 0.03 + Math.sin(x * 7 - t * 4) * 0.008 * k);
    }
    pa.needsUpdate = true; flagGeo.computeVertexNormals();
    root.rotation.y = -0.5 + Math.sin(t * 0.3) * 0.2;
  };
}

const BUILDERS = { link: buildLink, network: buildNetwork, flag: buildFlag };
const canvas = document.getElementById('art');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'low-power' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.45;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
scene.environment = makeEnv(renderer);
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
rig(scene);
const tick = (BUILDERS[OBJ] || buildLink)(scene, camera, MAT());

const resize = () => {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
};
new ResizeObserver(resize).observe(canvas); resize();

let shown = false, t = STILL ? 1.2 : 0, last = performance.now();
const draw = () => {
  scene.updateMatrixWorld(); tick(t); renderer.render(scene, camera);
  if (!shown) { shown = true; window.__tqArt = true; requestAnimationFrame(() => { try { parent.postMessage({ tqReady: true }, location.origin); } catch (e) {} }); }
};
const frame = (now) => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!window.__tqPaused && !document.hidden) { t += dt * SPEED; draw(); }
  requestAnimationFrame(frame);
};
if (STILL) draw(); else requestAnimationFrame(frame);
</script>
</body></html>
