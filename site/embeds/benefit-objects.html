<title>TradeQuo key benefits — embed</title>
<!--
  "Why partners choose TradeQuo" on Partner Programs (from the Key_Benefits_Objects design):
  eight 3D objects on glass pedestals, one per benefit. The active one rises, its rim turns red,
  a red glow lights behind it and it plays its own animation; the rest sit slightly out of focus
  (each pedestal is drawn as its own pass and blurred by how far it is from focus).
  The page owns the active benefit: it posts {tqKb: i}; a tap on a chip posts {tqKbPick: i}
  back. Opened on its own, the scene cycles by itself.
  Layout follows the stage: 4×2 on wide stages, 2×4 on tall ones (phones), where the chips show
  the number and icon only — the card under the scene carries the words.
  ?lang=xx   chip labels from i18n.js (embed.kb.1 … embed.kb.8)
  ?still     every object in focus, nothing active, no chips — the posters
             (tools/render-program-posters.mjs); the live scene opens on this frame and then
             lets the inactive pedestals drift out of focus
  The page sets window.__tqPaused while the block is off screen; the first drawn frame posts
  {tqReady:true} so the page fades this frame in over its poster.
-->

    const hs = new THREE.Shape(); hs.moveTo(-0.19, -0.13); hs.lineTo(-0.07, 0.03); hs.lineTo(0.0, -0.05); hs.lineTo(0.07, 0.0); hs.lineTo(0.19, -0.13); hs.closePath();
    mesh(new THREE.ExtrudeGeometry(hs, { depth: 0.012, bevelEnabled: false }), chrome, top, 0, 0, 0.022);
    mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.02, 32), brushed, o, 0, 0.01, 0);
    mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.18, 12), chrome, o, 0, 0.09, -0.03);
    return (t, dt, e) => {
      const sp = 0.1 + 0.16 * e;
      cards.forEach((c, k) => { const d = k - 1; c.rotation.z = -d * sp; c.position.set(d * (0.05 + 0.08 * e), Math.abs(d) * -0.01, k * 0.03); });
    };
  },
  // 07 · TradingView + signals: mini glass candles, ruby signal arcs broadcast from the tallest
  (o) => {
    const g = grp(o, 0);
    const Hs = [0.2, 0.28, 0.4], Bs = [0.1, 0.16, 0.2];
    Hs.forEach((h, k) => {
      const x = (k - 1) * 0.17, c = grp(g); c.position.x = x;
      const body = prism(0.11, 0.11, h, 0.025, 0.006); body.translate(0, Bs[k], 0); glass(body, c);
      const core = prism(0.035, 0.035, h - 0.04, 0.012, 0.004); core.translate(0, Bs[k] + 0.02, 0); mesh(core, chrome, c);
      mesh(new THREE.CylinderGeometry(0.007, 0.007, Bs[k] + h + 0.08, 10), chrome, c, 0, (Bs[k] + h + 0.08) / 2, 0);
    });
    mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.012, 48), brushed, o, 0, 0.006, 0);
    const top = new V(0.17, 0.66, 0);
    const arcs = [0.07, 0.12, 0.17].map((r) => {
      const m = new THREE.Mesh(new THREE.TorusGeometry(r, 0.009, 8, 48, 1.5), new THREE.MeshBasicMaterial({ color: 0xE7131B, transparent: true, opacity: 0, depthWrite: false }));
      m.rotation.z = Math.PI / 2 - 0.75; m.position.copy(top).y -= 0.06; m.renderOrder = 4; g.add(m); return m;
    });
    return (t, dt, e) => {
      arcs.forEach((m, k) => { const ph = ((t * (0.8 + 0.8 * e) - k * 0.22) % 1 + 1) % 1; m.material.opacity = (0.18 + 0.7 * e) * Math.sin(ph * Math.PI); });
    };
  },
  // 08 · incentive trips: glass globe with chrome meridians, ruby dot circling on an orbit
  (o) => {
    const g = grp(o, 0.44); g.rotation.z = 0.35;
    glass(new THREE.SphereGeometry(0.25, 48, 32), g);
    const mer = new THREE.TorusGeometry(0.252, 0.005, 8, 96);
    mesh(mer, brushed, g); mesh(mer, brushed, g).rotation.y = Math.PI / 2; mesh(mer, brushed, g).rotation.x = Math.PI / 2;
    [0.12, -0.12].forEach((y) => { const r = Math.sqrt(0.252 * 0.252 - y * y); const m = mesh(new THREE.TorusGeometry(r, 0.004, 8, 80), brushed, g, 0, y, 0); m.rotation.x = Math.PI / 2; });
    const orb = grp(g); orb.rotation.set(1.15, 0, -0.5);
    mesh(new THREE.TorusGeometry(0.36, 0.005, 8, 120), chrome, orb);
    const dot = mesh(new THREE.SphereGeometry(0.03, 20, 14), ruby, orb);
    mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.02, 32), brushed, o, 0, 0.01, 0);
    mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.18, 12), chrome, o, 0, 0.1, 0);
    let ph = 0;
    return (t, dt, e) => { ph += dt * (0.7 + 2.2 * e); dot.position.set(Math.cos(ph) * 0.36, Math.sin(ph) * 0.36, 0); g.rotation.y = t * 0.15; };
  },
];

const slots = BUILDERS.map((b, i) => {
  const g = new THREE.Group(); root.add(g);
  glass(pedGeo, g);
  const rimM = brushed.clone(); mesh(rimGeo, rimM, g, 0, 0.08, 0);
  mesh(footRim, chrome, g, 0, 0.002, 0);
  mesh(footPlate, brushed, g, 0, -0.008, 0);
  const o = grp(g, 0.1);
  const upd = b(o);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, depthWrite: false, opacity: 0 })); halo.position.set(0, 0.48, -0.3); halo.scale.set(1.15, 1.0, 1); halo.renderOrder = 1; g.add(halo);
  const spot = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.4), new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, depthWrite: false, opacity: 0 })); spot.rotation.x = -Math.PI / 2; spot.position.y = 0.002; spot.renderOrder = 1; g.add(spot);
  blob(g, 1.4, 1.4, -0.002, 0.3);
  g.traverse((x) => x.layers.set(i + 1));
  return { g, o, rimM, upd, halo, spot, k: 0, on: false, since: -9 };
});
scene.traverse((x) => { if (x.isLight) x.layers.enableAll(); });

/* layout: the design's 4×2 shelf, or 2×4 on tall (phone) stages */
const place = () => slots.forEach((s, i) => {
  if (tall) { const col = i % 2, row = Math.floor(i / 2); s.g.position.set((col - 0.5) * 1.3, (3 - row) * 1.34, 0); }
  else { const col = i % 4, row = Math.floor(i / 4); s.g.position.set((col - 1.5) * 1.3, row ? 0 : 1.42, 0); }
});
const placeCamera = (t) => {
  const asp = W / H || 1.555;
  if (tall) {
    const d = Math.max(11.2, 1.75 / (Math.tan(13 * Math.PI / 180) * asp));
    camera.position.set(0.1 + Math.sin(t * 0.18) * 0.12, 2.1 + d * 0.2, d); camera.lookAt(0.02, 2.1, 0);
  } else {
    const k = Math.max(1, (1120 / 720) / Math.max(0.6, asp));
    camera.position.set((0.15 + Math.sin(t * 0.18) * 0.2) * k, 2.6 + 0.9 * (k - 1), 7.7 * k); camera.lookAt(0.05, 1.0, 0);
  }
  camera.updateMatrixWorld();
};

/* chips */
const embedded = window.parent !== window;
let active = 0, holdUntil = 0, nextStep = 2.5, clock = 0;
const chips = STILL ? [] : LABELS.map((txt, i) => {
  const d = document.createElement('button');
  d.type = 'button'; d.className = 'chip'; d.tabIndex = -1;
  d.innerHTML = '<b></b><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + ICONS[i] + '</svg><span></span>';
  d.querySelector('b').textContent = String(i + 1).padStart(2, '0');
  d.querySelector('span').textContent = txt;
  d.addEventListener('click', () => {
    active = i; holdUntil = clock + 7;
    if (embedded) { try { parent.postMessage({ tqKbPick: i }, location.origin); } catch (e) {} }
  });
  chipBox.appendChild(d);
  return d;
});
addEventListener('message', (e) => {
  if (e.origin !== location.origin || !e.data || typeof e.data.tqKb !== 'number') return;
  active = Math.max(0, Math.min(7, e.data.tqKb | 0));
});
/* opened on its own (no page around it), the scene cycles itself like the design */
const selfCycle = () => {
  if (embedded || STILL) return;
  if (clock >= Math.max(nextStep, holdUntil)) { active = (active + 1) % 8; nextStep = clock + 2.5; }
};

/* the first frame has every object in focus (= the poster); the inactive ones then drift out */
let wake = 1;
const focus = new Array(8).fill(1);
const tmp = new V(), wp = new V();
const tick = (t, dt) => {
  placeCamera(t);
  slots.forEach((s, i) => {
    const on = !STILL && i === active;
    if (on && !s.on) s.since = t;
    s.on = on;
    s.k = damp(s.k, on ? 1 : 0, dt, 4.5);
    const e = ease(clamp01(s.k));
    s.o.position.y = 0.1 + 0.1 * e + Math.sin(t * 1.2 + i) * 0.012;
    s.o.rotation.y = Math.sin(t * 0.5 + i * 0.9) * 0.3 * (1 - 0.6 * e);
    s.rimM.color.lerpColors(cRim, cRed, e * 0.7); s.rimM.emissive.lerpColors(cRimEm, cRedEm, e * 0.6);
    s.halo.material.opacity = 0.7 * e; s.spot.material.opacity = 0.85 * e;
    s.upd(t, dt, e, s);
    focus[i] = Math.max(ease(clamp01(s.k)), wake);
  });
  scene.updateMatrixWorld();
  const cs = compact ? 1 : Math.min(1, W / 1060);
  chips.forEach((c, i) => {
    const s = slots[i], fe = focus[i];
    tmp.set(0, 0, 0.5); s.g.localToWorld(tmp);
    const [x, y] = toScreen(tmp);
    c.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,${compact ? 2 : 6}px) scale(${(cs * (1 + 0.08 * fe)).toFixed(3)})`;
    c.style.filter = fe > 0.98 ? 'none' : `blur(${((1 - fe) * 1.2).toFixed(2)}px)`;
    c.style.opacity = shown ? (0.62 + 0.38 * fe).toFixed(3) : 0;
    c.style.zIndex = fe > 0.5 ? 2 : 1;
    c.classList.toggle('is-on', i === active);
  });
};
const canBlur = 'filter' in CanvasRenderingContext2D.prototype;
/* Each pedestal covers about an eighth of the stage: render, blur and copy only its own
   rectangle (the projected box around pedestal, object, glow and shadow), not the whole canvas. */
const corner = new V();
const rectOf = (s, pad) => {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let k = 0; k < 8; k++) {
    corner.set(k & 1 ? 0.76 : -0.76, k & 2 ? 1.2 : -0.08, k & 4 ? 0.76 : -0.76); s.g.localToWorld(corner);
    const [x, y] = toScreen(corner);
    x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
  }
  x0 = Math.max(0, Math.floor(x0 - pad)); y0 = Math.max(0, Math.floor(y0 - pad));
  x1 = Math.min(W, Math.ceil(x1 + pad)); y1 = Math.min(H, Math.ceil(y1 + pad));
  return x1 > x0 && y1 > y0 ? [x0, y0, x1 - x0, y1 - y0] : null;
};
const drawPasses = () => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (focus.every((f) => f > 0.98)) {   // all sharp (the poster frame): one pass
    renderer.setScissorTest(false);
    camera.layers.enableAll(); renderer.render(scene, camera); camera.layers.set(0);
    ctx.drawImage(renderer.domElement, 0, 0, canvas.width, canvas.height);
    return;
  }
  renderer.setScissorTest(true);
  slots.map((s, i) => ({ i, d: s.g.getWorldPosition(wp).distanceToSquared(camera.position) })).sort((a, b) => b.d - a.d).forEach(({ i }) => {
    const f = focus[i], blur = canBlur && f < 0.98 ? (1 - f) * 2.2 * Math.min(1, Math.max(0.45, W / 1060)) : 0;   // smaller stage, softer blur
    const r = rectOf(slots[i], 4 + blur * 3); if (!r) return;
    const [x, y, w, h] = r;
    renderer.setScissor(x, H - y - h, w, h);
    camera.layers.set(i + 1); renderer.render(scene, camera);
    ctx.filter = blur ? 'blur(' + (blur * PR).toFixed(2) + 'px)' : 'none';
    ctx.globalAlpha = canBlur ? 0.82 + 0.18 * f : 0.55 + 0.45 * f;
    const sx = Math.round(x * PR), sy = Math.round(y * PR), sw = Math.round(w * PR), sh = Math.round(h * PR);
    ctx.drawImage(renderer.domElement, sx, sy, sw, sh, sx, sy, sw, sh);
  });
  renderer.setScissorTest(false);
  ctx.filter = 'none'; ctx.globalAlpha = 1; camera.layers.set(0);
};

let shown = false, last = performance.now();
const resize = () => {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h || (w === W && h === H)) return;   // resizing a canvas clears it
  W = w; H = h;
  tall = w / h < 1; compact = w < 560;
  document.body.classList.toggle('compact', compact);
  canvas.width = Math.round(w * PR); canvas.height = Math.round(h * PR);
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  place();
  if (STILL && shown) draw(0);
};
new ResizeObserver(resize).observe(canvas); resize();

const draw = (dt) => {
  tick(clock, dt); drawPasses();
  if (!shown) {
    shown = true; window.__tqArt = true;
    requestAnimationFrame(() => { if (embedded) { try { parent.postMessage({ tqReady: true }, location.origin); } catch (e) {} } });
  }
};
const frame = (now) => {
  const dt = Math.min(0.05, (now - last) / 1000) * SPEED; last = now;
  if (W && (!shown || (!window.__tqPaused && !document.hidden))) {
    if (shown) { clock += dt; wake = Math.max(0, wake - dt / 0.8); }
    selfCycle(); draw(shown ? dt : 0);
  }
  requestAnimationFrame(frame);
};
if (STILL) draw(0); else requestAnimationFrame(frame);
</script>
</body></html>
