<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradeQuo — Glass Logo</title>
<!--
  TradeQuo glass logo (three.js, WebGL)
  Embed:  <iframe src="tradequo-glass-logo.html" style="width:100%;height:600px;border:0" title="TradeQuo"></iframe>
  Params: ?theme=dark|light  &motion=spin|continuous|sway  &speed=1   (e.g. tradequo-glass-logo.html?theme=light&motion=sway)
  Pauses rendering when off-screen / tab hidden; static frame for prefers-reduced-motion.
-->
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #tq-glass-logo { position: relative; width: 100%; height: 100%; min-height: 0; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<div id="tq-glass-logo" role="img" aria-label="TradeQuo"></div>
<script type="module">
import * as THREE from '../vendor/three/three.module.min.js';

class GlassLogo {
  constructor(el, props) {
    this.wrapRef = { current: el };
    this.props = props;
    this.T = THREE;
    this.setup();
  }
  destroy() {
    this.dead = true;
    cancelAnimationFrame(this.raf); this.raf = null;
    this.ro && this.ro.disconnect(); this.io && this.io.disconnect();
    window.removeEventListener('pointermove', this.onMove);
    document.removeEventListener('visibilitychange', this.onVis);
    if (this.R) { this.R.dispose(); this.R.domElement.remove(); }
  }

  setup() {
    const T = this.T, wrap = this.wrapRef.current;
    const R = new T.WebGLRenderer({ antialias: true, alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
    R.setClearColor(0x000000, 0);
    this.bgCanvas = document.createElement('canvas');
    this.bgCanvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block;';
    wrap.appendChild(this.bgCanvas);
    R.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    R.outputColorSpace = T.SRGBColorSpace;
    R.toneMapping = T.NoToneMapping;
    R.toneMappingExposure = 1;
    R.domElement.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block;';
    wrap.appendChild(R.domElement);
    this.R = R;
    this.scene = new T.Scene();
    this.cam = new T.PerspectiveCamera(26, 1, 0.1, 200);
    this.pivot = new T.Group(); this.scene.add(this.pivot);
    this.logo = new T.Group(); this.pivot.add(this.logo);

    const s = 1 / 20, cx = 100.75, cy = 100;
    const P = (x, y) => [(x - cx) * s, (cy - y) * s];
    const tab = new T.Shape();
    const [ax, ay] = P(48, 58.5);
    tab.moveTo(ax, ay); tab.lineTo(...P(68.5, 58.5));
    tab.absarc(ax, ay, 20.5 * s, 0, -Math.PI / 2, true);
    tab.lineTo(ax, ay);
    const tt = new T.Shape();
    tt.moveTo(...P(104.5, 58.5)); tt.lineTo(...P(153.5, 58.5)); tt.lineTo(...P(133, 79)); tt.lineTo(...P(110, 79));
    tt.lineTo(...P(110, 120)); tt.lineTo(...P(89.5, 140.5)); tt.lineTo(...P(89.5, 77));
    tt.quadraticCurveTo(...P(93, 61), ...P(104.5, 58.5));
    const depth = 0.72;
    const geo = new T.ExtrudeGeometry([tab, tt], { depth, bevelEnabled: true, bevelThickness: 0.13, bevelSize: 0.075, bevelOffset: -0.075, bevelSegments: 10, curveSegments: 64 });
    geo.translate(0, 0, -depth / 2);

    this.glass = new T.MeshPhysicalMaterial({
      color: new T.Color('#050506'), metalness: 0.25, roughness: 0.03, ior: 1.5,
      specularIntensity: 1, clearcoat: 1, clearcoatRoughness: 0.02, envMapIntensity: 2.8,
    });
    this.redMat = new T.MeshPhysicalMaterial({
      color: new T.Color('#E42320'), metalness: 0, roughness: 0.06, ior: 1.5, clearcoat: 1, clearcoatRoughness: 0.03,
      emissive: new T.Color('#E42320'), emissiveIntensity: 0.35, envMapIntensity: 1.2,
    });
    this.logo.add(new T.Mesh(geo, this.glass));
    const dot = new T.Mesh(new T.SphereGeometry(10.5 * s, 96, 64), this.redMat);
    const [dx, dy] = P(141, 130.5);
    dot.position.set(dx, dy, 0);
    this.logo.add(dot);

    this.dotPos = new T.Vector3(dx, dy, 0);

    this.mouse = { x: 0, y: 0, tx: 0, ty: 0 };
    this.t = 0; this.visible = true;
    this.reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.applyTheme();
    this.resize();
    this.ro = new ResizeObserver(() => this.resize()); this.ro.observe(wrap);
    this.io = new IntersectionObserver(([e]) => { this.visible = e.isIntersecting; if (this.visible) this.kick(); }); this.io.observe(wrap);
    this.onMove = (e) => {
      const r = wrap.getBoundingClientRect();
      this.mouse.tx = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - 0.5) * 2));
      this.mouse.ty = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height - 0.5) * 2));
    };
    window.addEventListener('pointermove', this.onMove, { passive: true });
    this.onVis = () => { if (!document.hidden) this.kick(); };
    document.addEventListener('visibilitychange', this.onVis);
    this.render3d(0);
    this.kick();
  }

  applyTheme() {
    const T = this.T, dark = (this.props.theme ?? 'Dark') === 'Dark';
    this.wrapRef.current.style.background = 'transparent';

    const es = new T.Scene();
    es.background = new T.Color(dark ? 0x000000 : 0xf4f4f4);
    const box = (w, h, x, y, z, col, k) => {
      const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: new T.Color(col).multiplyScalar(k), side: T.DoubleSide }));
      m.position.set(x, y, z); m.lookAt(0, 0, 0); es.add(m);
    };
    if (dark) {
      box(16, 3, 0, 9, 2, '#ffffff', 3.2);
      box(1.3, 14, -9, 0, 3, '#ffffff', 2.4);
      box(1, 14, 9, 1, -2, '#ffffff', 1.6);
      box(12, 0.7, 0, -1.5, -10, '#ffffff', 1.5);
      box(5, 5, 6, 4, 9, '#ffffff', 1.1);
      box(10, 6, 0, -9, 4, '#9aa0a6', 0.35);
      box(12, 7, 0, 3, 11, '#ffffff', 0.45);
      box(3, 9, -6, 2, 9, '#ffffff', 2.2);
    } else {
      box(16, 3, 0, 9, 2, '#ffffff', 2.2);
      box(1.6, 14, -9, 0, 3, '#141414', 1);
      box(1.2, 14, 9, 1, -2, '#202020', 1);
      box(12, 0.9, 0, -1.5, -10, '#2a2a2a', 1);
      box(5, 5, 6, 4, 9, '#ffffff', 1.6);
      box(14, 5, 0, -9, 4, '#bdbdbd', 1);
    }
    const pm = new T.PMREMGenerator(this.R);
    const rt = pm.fromScene(es, 0.015);
    pm.dispose();
    es.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
    if (this.envRT) this.envRT.dispose();
    this.envRT = rt;
    this.scene.environment = rt.texture;

    this.drawBackdrop();

    this.redMat.emissiveIntensity = dark ? 0.35 : 0.08;

  }

  resize() {
    const wrap = this.wrapRef.current;
    if (!wrap || !this.R) return;
    const w = wrap.clientWidth, h = wrap.clientHeight;
    if (!w || !h) return;
    this.R.setSize(w, h, false);
    const cam = this.cam;
    cam.aspect = w / h;
    const tv = Math.tan((cam.fov / 2) * Math.PI / 180), fill = 0.6;
    const d = Math.max(2.3 / (tv * fill), 2.9 / (tv * cam.aspect * fill));
    cam.position.set(0, 0, d); cam.lookAt(0, 0, 0);
    cam.updateProjectionMatrix();
    this.drawBackdrop();
    if (this.reduced || !this.raf) this.render3d(0);
  }

  drawBackdrop() {
    const T = this.T, wrap = this.wrapRef.current;
    if (!T || !wrap || !this.cam) return;
    const dark = (this.props.theme ?? 'Dark') === 'Dark', bg = dark ? '#050506' : '#FFFFFF';
    const w = wrap.clientWidth || 16, h = wrap.clientHeight || 9;
    const W = 1280, H = Math.max(256, Math.min(2560, Math.round((W * h) / w)));
    const c = this.bgCanvas; c.width = W; c.height = H;
    const x = c.getContext('2d'), u = Math.min(W, H) / 1024, cx = W / 2, cy = H / 2;
    x.clearRect(0, 0, W, H);
    const c0 = '128,134,143';
    const band = (off, bw, al) => {
      const lg = x.createLinearGradient(-700, 0, 700, 0);
      lg.addColorStop(0, 'rgba(' + c0 + ',0)'); lg.addColorStop(0.5, 'rgba(' + c0 + ',' + al + ')'); lg.addColorStop(1, 'rgba(' + c0 + ',0)');
      x.fillStyle = lg; x.fillRect(-700, off, 1400, bw);
    };
    x.save(); x.translate(cx, cy); x.scale(u, u); x.rotate(-0.55); x.filter = 'blur(' + Math.round(10 * u) + 'px)';
    band(-130, 28, 0.42); band(-66, 8, 0.3); band(64, 18, 0.36); band(148, 5, 0.26);
    x.restore();
    const v = this.dotPos.clone().project(this.cam);
    x.filter = 'blur(' + Math.round(40 * u) + 'px)';
    x.fillStyle = 'rgba(228,35,32,0.12)';
    x.beginPath(); x.arc(((v.x + 1) / 2) * W, ((1 - v.y) / 2) * H, 110 * u, 0, Math.PI * 2); x.fill();
    x.filter = 'none';
    this.scene.background = null;
  }

  kick() {
    if (this.raf || this.reduced || !this.R) return;
    this.last = performance.now();
    this.raf = requestAnimationFrame(this.frame);
  }
  frame = (now) => {
    this.raf = null;
    if (this.dead || !this.visible || document.hidden) return;
    const dt = Math.min(0.05, (now - this.last) / 1000); this.last = now;
    this.render3d(dt);
    this.raf = requestAnimationFrame(this.frame);
  };

  render3d(dt) {
    const sp = this.props.speed ?? 1;
    this.t += dt * sp;
    const t = this.t, m = this.mouse, TAU = Math.PI * 2;
    const e = Math.min(1, dt * 2.5);
    m.x += (m.tx - m.x) * e; m.y += (m.ty - m.y) * e;
    const mode = this.props.motion ?? 'Spin & pause';
    let ang;
    if (mode === 'Continuous') ang = (t * TAU) / 16;
    else if (mode === 'Sway') ang = 0.55 * Math.sin((t * TAU) / 9);
    else {
      const Pd = 10, u = (t % Pd) / Pd, hold = 0.4;
      const v = u < hold ? 0 : (u - hold) / (1 - hold);
      ang = (v < 0.5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2) * TAU;
    }
    this.logo.rotation.y = ang;
    this.pivot.rotation.x = -0.08 + 0.035 * Math.sin(t * 0.7) + m.y * 0.12;
    this.pivot.rotation.y = m.x * 0.18;
    this.pivot.rotation.z = 0.025 * Math.sin(t * 0.5);
    this.pivot.position.y = 0.06 * Math.sin(t * 0.9);
    this.R.render(this.scene, this.cam);
  }
}

const q = new URLSearchParams(location.search);
const theme = q.get('theme') === 'light' ? 'Light' : 'Dark';
const motion = { continuous: 'Continuous', sway: 'Sway' }[q.get('motion')] || 'Spin & pause';
const speed = q.has('speed') ? Math.max(0, parseFloat(q.get('speed')) || 0) : 1;

window.tqGlassLogo = new GlassLogo(document.getElementById('tq-glass-logo'), { theme, motion, speed });
</script>
</body>
</html>
