<title>TradeQuo trust dome — embed</title>
<!--
  "A broker traders trust" on Partner Programs (from the Trust_Dome_Partners design): a flat hex
  field rises into a glass dome around the TradeQuo dot, partners stand inside wired to it (red
  beads = daily payouts), stray particles bounce off the dome and their risk label is struck out.
  The four stats are page text next to this frame (siblings with [data-stat]); while they sit in
  the stage corners this frame fades them in and draws their leader lines to the dome. On phones
  they sit under the stage and are left alone.
  The scene holds its first frame (the flat field, like the poster) and plays the build from the
  start once half the stage is on screen; reduced motion shows the finished dome. A click replays it.
  ?lang=xx   risk labels from i18n.js (embed.dome.r1 … r4)
  ?still     the first frame (flat field), no overlay — the poster (tools/render-program-posters.mjs)
  The page sets window.__tqPaused while the block is off screen; the first drawn frame posts
  {tqReady:true} so the page fades this frame in over its poster.
-->

const STAT_DIRS = [[-0.66, 0.6, 0.45], [0.66, 0.6, 0.45], [-0.82, 0.22, 0.53], [0.82, 0.22, 0.53]].map((a) => new V3(...a).normalize());

/* ---- renderer ---------------------------------------------------------------------- */
const canvas = document.getElementById('art');
const over = document.getElementById('over');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'low-power' });

const v = new V3();

/* the design's camera, for a 600×520 stage; narrower stages pull back so the field stays in shot */
const cam = (t) => {

const NS = 'http://www.w3.org/2000/svg';
const svg = document.createElementNS(NS, 'svg'); over.appendChild(svg);
const mk = (tag, at) => { const e = document.createElementNS(NS, tag); Object.entries(at).forEach(([k, val]) => e.setAttribute(k, val)); svg.appendChild(e); return e; };
const calls = STILL ? [] : stats.slice(0, 4).map((st) => ({
  st, left: (st.dataset.stat || 'tl')[1] === 'l', sx: 0, sy: 0, op: -1,
  line: mk('line', { stroke: 'rgba(14,14,22,0.3)', 'stroke-width': 1 }),
  s0: mk('circle', { r: 2.5, fill: '#0E0E10', 'fill-opacity': 0.45 }),

const rips = [0, 1, 2].map(() => {
  const m = new THREE.Mesh(rGeo, new THREE.MeshBasicMaterial({ color: 0xE7131B, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide }));
  m.renderOrder = 5; m.visible = false; root.add(m); return { m, t: -9, n: new V3() };
});
let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
let next = DONE + 0.4, pi = 0, ri = 0, ti = 0, rk = 0, lastT = 0;
const m4 = new THREE.Matrix4(), pos = new V3(), sc = new V3(), col = new THREE.Color(), wp = new V3(), n = new V3(), tmp = new V3();
const tick = (t, dt) => {
  if (t < lastT) { parts.forEach((p) => { p.st = 0; p.m.visible = false; }); rips.forEach((r) => r.t = -9); threats.forEach((th) => th.t = -9); next = DONE + 0.4; }
  lastT = t;
  cam(t);
  root.rotation.y = Math.sin(t * 0.2) * 0.1;
  if (!STILL && t >= next) {
    const p = parts[pi++ % 3], th = 0.35 + rnd() * 0.75, ph = Math.PI / 2 + (rnd() - 0.5) * 2.4;
    n.set(Math.sin(th) * Math.cos(ph), Math.cos(th), Math.sin(th) * Math.sin(ph));
    p.m.position.copy(n).multiplyScalar(4.4).add(tmp.set(rnd() - 0.5, rnd() * 0.5, rnd() - 0.5));
    p.v.copy(n).multiplyScalar(R).sub(p.m.position).normalize().multiplyScalar(3.0);
    p.st = 1; p.life = 0; p.m.visible = true; p.m.material.opacity = 1;
    next = t + 1.3 + rnd() * 0.6;
  }
  parts.forEach((p) => {
    if (!p.st) return;
    p.m.position.addScaledVector(p.v, dt);
    if (p.st === 1 && p.m.position.length() <= R + 0.05) {
      n.copy(p.m.position).normalize(); p.v.reflect(n).multiplyScalar(0.55); p.st = 2;
      const th = threats[ti++ % 3]; th.t = t; th.p.copy(n).multiplyScalar(R + 0.22); th.side = n.x < 0 ? -1 : 1; th.txt.textContent = RISKS[rk++ % RISKS.length];
      const r = rips[ri++ % 3]; r.t = t; r.n.copy(n); r.m.position.copy(n).multiplyScalar(R + 0.025); r.m.lookAt(tmp.copy(n).multiplyScalar(3)); r.m.visible = true;
    } else if (p.st === 2) { p.life += dt; p.m.material.opacity = 1 - p.life / 0.9; if (p.life > 0.9) { p.st = 0; p.m.visible = false; } }
  });
  rips.forEach((r) => {
    const q = (t - r.t) / 0.9;
    if (q < 0 || q > 1) { r.m.visible = false; return; }
    r.m.scale.setScalar(0.05 + 0.42 * easeOut(q)); r.m.material.opacity = 0.75 * (1 - q);
  });
  TL.forEach((x, i) => {
    if (x.dome) {
      const e = ease(clamp01((t - x.delay) / DUR));
      const a = x.flatB.elements, b = x.dome.B.elements, me = m4.elements;
      for (let j = 0; j < 16; j++) me[j] = a[j] + (b[j] - a[j]) * e;
      pos.lerpVectors(x.flatP, x.dome.P, e); pos.y += 0.3 * Math.sin(e * Math.PI);
      m4.setPosition(pos);
      let fl = 0;
      rips.forEach((r) => { const q = (t - r.t) / 0.9; if (q >= 0 && q <= 1) { const ang = Math.acos(Math.min(1, x.dome.N.dot(r.n))); fl += Math.exp(-ang * ang / 0.06) * (1 - q); } });
      const lit = stat.includes(i) ? clamp01((t - x.delay - DUR) / 0.4) : 0;
      col.setRGB(1, 1, 1).lerp(RED, Math.min(1, lit * 0.85 + fl * 0.9));
      D.front.setColorAt(i, col); col.setScalar(1 + fl * 0.9); D.band.setColorAt(i, col);
    } else {
      m4.copy(x.flatB); m4.scale(sc.set(x.sp, 1, x.sp)); m4.setPosition(x.flatP);
    }
    D.set(i, m4);
  });
  D.commit(); core(t);
  pawns.forEach((p, i) => {
    p.g.scale.setScalar(Math.max(0.0001, easeBack(clamp01((t - p.delay) / 0.5))));
    if (t > DONE) {
      const q = (((t - DONE) % 2.6) - i * 0.03) / 0.8;
      if (q >= 0 && q <= 1) {
        const e = ease(q); p.b.visible = true;
        p.b.position.set(Math.cos(p.a) * (0.12 + (p.rad * 0.93 - 0.12) * e), 0.03 + 0.04 * Math.sin(e * Math.PI), Math.sin(p.a) * (0.12 + (p.rad * 0.93 - 0.12) * e));
      } else p.b.visible = false;
    } else p.b.visible = false;
  });
  scene.updateMatrixWorld();
  stat.forEach((i, k) => {
    if (k === 2 && pawnFor >= 0) { callout(k, wp.set(0, 0.33, 0).add(pawns[pawnFor].g.position).applyMatrix4(root.matrixWorld), (t - DONE + 0.4) / 0.5, t); return; }
    callout(k, wp.copy(TL[i].dome.P).applyMatrix4(root.matrixWorld), (t - TL[i].delay - DUR) / 0.5, t);
  });
  threats.forEach((th) => {
    const q = t - th.t;
    if (q < 0 || q > 1.7) { th.d.style.opacity = 0; return; }
    const [x, y] = toScreen(wp.copy(th.p).applyMatrix4(root.matrixWorld));
    th.d.style.opacity = q < 0.15 ? q / 0.15 : q < 1.3 ? 1 : 1 - (q - 1.3) / 0.4;
    th.d.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(${th.side < 0 ? '-100%' : '0'},-50%) translateY(${(-q * 8).toFixed(1)}px)`;
    const sk = clamp01((q - 0.12) / 0.25);
    th.st.style.width = `calc(${(sk * 100).toFixed(1)}% + 8px)`;
    th.txt.style.color = sk >= 1 ? '#8A8A92' : '#0E0E10';
    const xk = easeBack(clamp01((q - 0.34) / 0.22));
    th.x.style.opacity = clamp01((q - 0.34) / 0.1); th.x.style.transform = `scale(${0.4 + 0.6 * xk})`;
  });
};

/* ---- run ------------------------------------------------------------------------------- */
const resize = () => {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  W = w; H = h;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  measure();
};
new ResizeObserver(resize).observe(canvas); resize();
try { parent.document.fonts.ready.then(measure); } catch (e) {}

/* How much of the stage is on screen (0…1). */
const shownPart = () => {
  try {
    const r = window.frameElement.getBoundingClientRect(), vh = parent.innerHeight;
    return Math.max(0, Math.min(r.bottom, vh) - Math.max(r.top, 0)) / (r.height || 1);
  } catch (e) { return 1; }
};
/* The build waits on its first frame (the flat field, same as the poster) and starts when
   half the stage is on screen, so the visitor always sees the dome assemble. Reduced
   motion skips straight to the finished dome. */
const START_AT = 0.5;
let clock = 0, started = STILL || reduce;
if (reduce && !STILL) clock = FINISHED;
/* stats already on screen when the scene first draws keep showing (no flash); otherwise
   they appear one by one as their tiles light up */
const statOnScreen = () => {
  try { const vh = parent.innerHeight; return stats.some((st) => { const r = st.getBoundingClientRect(); return r.bottom > 0 && r.top < vh; }); } catch (e) { return false; }
};
const paused = () => (window.__tqPaused === undefined ? shownPart() === 0 : window.__tqPaused) || document.hidden;
const replay = () => { clock = 0; started = true; keepStats = false; };
if (!STILL) {
  document.addEventListener('click', replay);
  if (host) host.addEventListener('click', (e) => { if (e.target.closest('[data-stat]')) replay(); });
}

let shown = false, last = performance.now(), sinceMeasure = 0;
const draw = (dt) => {
  tick(clock, dt); renderer.render(scene, camera);
  window.__tqDomeT = clock;   /* scene time, for tools/tests */
  if (!shown) {
    shown = true; window.__tqArt = true;
    requestAnimationFrame(() => { if (window.parent !== window) { try { parent.postMessage({ tqReady: true }, location.origin); } catch (e) {} } });
  }
};
const frame = (now) => {
  const dt = Math.min(0.05, (now - last) / 1000) * SPEED; last = now;
  if (W && !shown) { keepStats = statOnScreen(); draw(0); }
  else if (W && !paused()) {
    if (!started && shownPart() >= START_AT) started = true;
    if (started) {
      clock += dt;
      if ((sinceMeasure += dt) > 1) { sinceMeasure = 0; measure(); }
      draw(dt);
    }
  }
  requestAnimationFrame(frame);
};
if (STILL) draw(0); else requestAnimationFrame(frame);
</script>
</body></html>
