      color: new T.Color('#E42320'), metalness: 0, roughness: 0.05, transmission: 0.7, thickness: 1.05, ior: 1.5,
      attenuationColor: new T.Color('#FF2A22'), attenuationDistance: 0.5, clearcoat: 1, clearcoatRoughness: 0.03,
      emissive: new T.Color('#E42320'), emissiveIntensity: 0.35, envMapIntensity: 1.2,
    });
    this.logo.add(new T.Mesh(geo, glass));
    this.dot = new T.Mesh(new T.SphereGeometry(10.5 * s, 96, 64), red);
    const [dx, dy] = P(141, 130.5);
    this.dotBase = new T.Vector3(dx, dy, 0);
    this.dot.position.copy(this.dotBase);
    this.logo.add(this.dot);

    // studio environment (dark theme of the landing logo)
    const es = new T.Scene();
    es.background = new T.Color(0x000000);
    const box = (w, h, x, y, z, k, col = '#ffffff') => {
      const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: new T.Color(col).multiplyScalar(k), side: T.DoubleSide }));
      m.position.set(x, y, z); m.lookAt(0, 0, 0); es.add(m);
    };
    box(16, 3, 0, 9, 2, 3.2); box(1.3, 14, -9, 0, 3, 2.4); box(1, 14, 9, 1, -2, 1.6); box(12, 0.7, 0, -1.5, -10, 1.5);
    box(5, 5, 6, 4, 9, 1.1); box(10, 6, 0, -9, 4, 0.35, '#9aa0a6'); box(12, 7, 0, 3, 11, 0.45); box(3, 9, -6, 2, 9, 2.2);
    const pm = new T.PMREMGenerator(R);
    this.scene.environment = pm.fromScene(es, 0.015).texture;
    pm.dispose();

    this.scene.background = this.backdrop();
    this.out = document.createElement('canvas');
    this.out.width = RW; this.out.height = RH;
    this.octx = this.out.getContext('2d');
  }

  backdrop() {
    const W = 1600, H = 900, c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d'), u = H / 1024, cx = W / 2, cy = H / 2;
    x.fillStyle = '#050506'; x.fillRect(0, 0, W, H);
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, 520 * u);
    g.addColorStop(0, 'rgba(255,255,255,0.14)'); g.addColorStop(0.5, 'rgba(255,255,255,0.045)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    const band = (off, bw, al) => {
      const lg = x.createLinearGradient(-800, 0, 800, 0);
      lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, 'rgba(255,255,255,' + al + ')'); lg.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = lg; x.fillRect(-800, off, 1600, bw);
    };
    x.save(); x.translate(cx, cy); x.scale(u, u); x.rotate(-0.55); x.filter = 'blur(10px)';
    band(-130, 28, 0.34); band(-66, 8, 0.22); band(64, 18, 0.28); band(148, 5, 0.2);
    x.restore();
    x.filter = 'blur(40px)'; x.fillStyle = 'rgba(228,35,32,0.12)';
    x.beginPath(); x.arc(cx + 150 * u, cy + 120 * u, 140 * u, 0, Math.PI * 2); x.fill();
    x.filter = 'none';
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  // p: {ang, tilt, roll, camX, camY, camZ, dotOn, dotScale, dotX, dotY, dotZ}
  render(p) {
    this.logo.rotation.y = p.ang;
    this.pivot.rotation.x = p.tilt;
    this.pivot.rotation.z = p.roll;
    this.cam.position.set(p.camX, p.camY, p.camZ);
    this.cam.lookAt(p.camX, p.camY, 0);
    this.dot.visible = !!p.dotOn && p.dotScale > 0.001;
    this.dot.scale.setScalar(Math.max(0.001, p.dotScale));
    this.dot.position.set(this.dotBase.x + p.dotX, this.dotBase.y + p.dotY, p.dotZ);
    this.R.render(this.scene, this.cam);
  }

  // flat JPEG of the last render (optionally blurred) — what the video exporter sees
  snapshot(blur) {
    const x = this.octx;
    x.fillStyle = '#050506'; x.fillRect(0, 0, this.W, this.H);
    x.filter = blur > 0.05 ? 'blur(' + blur.toFixed(2) + 'px)' : 'none';
    x.drawImage(this.canvas, 0, 0);
    x.filter = 'none';
    return this.out.toDataURL('image/jpeg', 0.92);
  }
}

window.TQGlassRenderer = TQGlassRenderer;
